<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sovereign</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #F5F6F8; --panel: #FFFFFF; --line: #E3E6EA; --ink: #1A1D22; --muted: #6B7480; --soft: #F0F2F5;
    --gold: #B8901F; --gold-soft: rgba(184,144,31,.12);
    --ok: #2DA44E; --warn: #BF8700; --bad: #D1242F; --idle: #A5ADB8;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F1216; --panel: #171B21; --line: #262C35; --ink: #E8EAEE; --muted: #8A93A0; --soft: #1E232B;
            --gold: #C9A227; --gold-soft: rgba(201,162,39,.14); --ok: #3FB950; --warn: #D29922; --bad: #F85149; --idle: #5B6472; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  body { padding: 0 0 48px; }
  a { color: inherit; }
  button { font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  button.primary { background: var(--gold); border-color: var(--gold); color: #1A1400; font-weight: 600; }
  button.small { padding: 3px 9px; font-size: 12px; }
  button[disabled] { opacity: .5; cursor: default; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 28px; }

  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 96%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 14px; padding: 38px 28px 12px; }
  header .crown { width: 22px; height: 22px; color: var(--gold); flex: none; }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
  header .sub code { font-family: var(--mono); font-size: 11px; }
  header .grow { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.gold { background: var(--gold); }

  section { margin-top: 26px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; }
  .eyebrow .count { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

  /* needs you */
  .needs { border-left: 3px solid var(--gold); }
  .needs ul { list-style: none; margin: 0; padding: 6px 0; }
  .needs li { padding: 8px 16px; display: flex; gap: 12px; align-items: flex-start; border-top: 1px solid var(--line); }
  .needs li:first-child { border-top: 0; }
  .needs .k { font-family: var(--mono); font-size: 11px; color: var(--gold); min-width: 64px; padding-top: 2px; }
  .empty { color: var(--muted); padding: 14px 16px; }

  /* hub */
  .hub { display: grid; grid-template-columns: repeat(5, 1fr); }
  .hub .cell { padding: 14px 16px; border-left: 1px solid var(--line); }
  .hub .cell:first-child { border-left: 0; }
  .hub .lbl { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .hub .val { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .hub .val small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .hub .note { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .verdicts { border-top: 1px solid var(--line); padding: 10px 16px; font-family: var(--mono); font-size: 11px; color: var(--muted); display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 20px; }
  .verdicts b { color: var(--ink); font-weight: 500; }

  /* tools */
  .tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 12px; }
  .tool { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 176px; }
  .tool .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tool h3 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .state.connected { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .state.partial { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .wire { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .wire .glyph { font-family: var(--mono); font-size: 11px; width: 56px; color: var(--ink); white-space: nowrap; flex: none; }
  .wire .line { flex: 1; height: 2px; background: var(--line); position: relative; border-radius: 2px; }
  .wire .line i { position: absolute; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .wire.read .line i { left: 0; } .wire.write .line i { right: 0; }
  .wire .line.ok { background: color-mix(in srgb, var(--ok) 45%, var(--line)); } .wire .line.ok i { background: var(--ok); }
  .wire .line.warn { background: color-mix(in srgb, var(--warn) 45%, var(--line)); } .wire .line.warn i { background: var(--warn); }
  .wire .line.bad { background: color-mix(in srgb, var(--bad) 45%, var(--line)); } .wire .line.bad i { background: var(--bad); }
  .wire .age { font-family: var(--mono); font-size: 11px; min-width: 52px; text-align: right; color: var(--ink); }
  .tool .step { font-size: 12px; color: var(--gold); background: var(--gold-soft); border-radius: 7px; padding: 6px 9px; }
  .tool .actions { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .tool.add { border-style: dashed; align-items: flex-start; justify-content: center; color: var(--muted); }
  .tool.add select { font: inherit; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); }

  /* wire board + jobs tables */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
  tr:first-child td { border-top: 0; }
  td.mono, th.r { font-family: var(--mono); font-size: 11px; }
  th.r, td.r { text-align: right; font-variant-numeric: tabular-nums; }
  td .age { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
  td.name { font-weight: 500; }
  td.dim { color: var(--muted); font-size: 12px; }
  .badge { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; padding: 2px 0; }
  .chip b { font-weight: 600; font-family: var(--sans); font-size: 12px; }
  .chip .dim { color: var(--muted); }

  /* log drawer */
  #drawer { position: fixed; left: 0; right: 0; bottom: 0; transform: translateY(100%); transition: transform .18s ease; background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -12px 30px rgba(0,0,0,.18); z-index: 20; }
  #drawer.open { transform: none; }
  #drawer .bar { display: flex; align-items: center; gap: 10px; padding: 10px 28px; border-bottom: 1px solid var(--line); }
  #drawer .bar b { font-weight: 600; }
  #drawer pre { margin: 0; padding: 12px 28px 16px; max-height: 280px; overflow: auto; font-family: var(--mono); font-size: 11px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; }
  #drawer .grow { flex: 1; }

  .field { display: block; font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .field input { display: block; width: 100%; margin-top: 4px; font: 13px var(--sans); color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; }
  .field input:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: transparent; }
  footer { margin-top: 36px; color: var(--muted); font-size: 11px; }
  footer code { font-family: var(--mono); }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; }
  @media (prefers-reduced-motion: reduce) { #drawer { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <svg class="crown" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 18h18v2H3v-2zm0-2 1.5-9 4.5 4 3-6 3 6 4.5-4L21 16H3z"/></svg>
    <div>
      <h1 id="vault">Sovereign</h1>
      <div class="sub" id="sub">reading status…</div>
    </div>
    <div class="grow"></div>
    <span class="pill" id="hubpill"><span class="dot"></span>hub</span>
    <button id="refresh" title="Refresh (⌘R)">Refresh</button>
  </div>
</header>

<main class="wrap" id="main"><div class="loading">Asking <code>sov status</code>…</div></main>

<div id="drawer">
  <div class="bar"><b id="drawer-title">Output</b><span class="badge" id="drawer-state"></span><div class="grow"></div>
    <button class="small primary" id="drawer-apply" hidden>Install</button>
    <button class="small" id="drawer-close">Close</button></div>
  <pre id="drawer-log"></pre>
</div>

<script>
(function () {
  const $ = (s, r) => (r || document).querySelector(s);
  const bridge = (msg) => { try { window.webkit.messageHandlers.sov.postMessage(msg); } catch (e) { console.warn("no bridge", e); } };
  let state = null, pendingConnect = null;

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmtAge = (h) => h == null ? "–" : h < 1 ? Math.max(1, Math.round(h * 60)) + "m" : h < 48 ? (Math.round(h * 10) / 10) + "h" : Math.round(h / 24) + "d";
  const contentDot = (h) => h == null ? "" : h <= 24 ? "ok" : h <= 24 * 7 ? "warn" : "";
  const parseRun = (s) => { const m = /Last run: (\S+)/.exec(s || ""); if (!m) return null; const t = Date.parse(m[1]); return isNaN(t) ? null : (Date.now() - t) / 36e5; };
  const wireDot = (ageH, intervalS) => ageH == null ? "" : ageH * 3600 <= (intervalS || 900) * 2.5 ? "ok" : ageH <= 24 ? "warn" : "bad";
  const clock = (iso) => { if (!iso) return "?"; const d = new Date(iso); return isNaN(d) ? iso.slice(11, 16) : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
  const day = (iso) => { if (!iso) return "?"; const d = new Date(iso); return isNaN(d) ? iso.slice(0, 10) : d.toLocaleDateString([], { month: "short", day: "numeric" }); };

  function renderSetup(d) {
    const m = d.machine || {};
    $("#vault").textContent = "Sovereign";
    $("#sub").textContent = "this Mac is not connected to a brain yet";
    $("#hubpill").innerHTML = `<span class="dot"></span>not connected`;
    $("#main").innerHTML = `<section><p class="eyebrow">Connect this Mac</p>
      <div class="panel" style="padding:18px 20px;max-width:640px">
        <p style="margin:0 0 14px;color:var(--muted)">Point this Mac at a brain once. Every tool found here gets both wires: it reads the brain when a session starts, and its notes flow back to its own lane. Nothing runs until you see the dry run and press Install.</p>
        <label class="field">Vault folder<input id="f-vault" placeholder="/Users/you/Documents/My Brain"></label>
        <label class="field">This Mac's short name<input id="f-host" value="${esc(m.host || "")}"></label>
        <label class="field">Always-on cards, comma separated<input id="f-core" placeholder="me,how-to-work-with-me"></label>
        <label class="field">Hub, if the vault's hub is another machine (ssh alias:path)<input id="f-hub" placeholder="hub:/Users/you/Brain"></label>
        <div style="display:flex;gap:8px;margin-top:6px"><button class="primary" id="setup-dry">See the dry run</button></div>
      </div></section>`;
  }

  function render(d) {
    state = d;
    const m = d.machine || {}, hub = d.hub || {};
    if (!m.connected) return renderSetup(d);
    $("#vault").textContent = m.vault_name || "Sovereign";
    $("#sub").innerHTML = `host <code>${esc(m.host)}</code> · template <code>${esc(m.template_rev || "?")}</code> · refreshed ${clock(d.generated_at)}`;
    const hp = $("#hubpill");
    if (hub.reachable) {
      const st = hub.status || {};
      hp.innerHTML = `<span class="dot ok"></span>hub ${esc(hub.via === "local" ? "here" : hub.via.replace("ssh ", "").toUpperCase())} · nightly ${clock(st.generated_at)} · ${hub.pending || 0} waiting`;
    } else if (hub.reachable === false) {
      hp.innerHTML = `<span class="dot bad"></span>hub not answering`;
    } else {
      hp.innerHTML = `<span class="dot"></span>hub not checked`;
    }

    const parts = [];
    // needs you
    const needs = d.needs_you || [];
    parts.push(`<section><p class="eyebrow">Needs you <span class="count">${needs.length ? needs.length : "nothing right now"}</span></p>
      <div class="panel needs">${needs.length ? `<ul>${needs.map(n => `<li><span class="k">${esc(n.kind)}</span><span>${esc(n.text)}</span></li>`).join("")}</ul>`
      : `<div class="empty">Every wire is running and nothing is waiting at the gate.</div>`}</div></section>`);

    // hub
    if (hub.reachable) {
      const st = hub.status || {}, k = hub.knowledge || {}, cov = st.coverage || {}, j = hub.jobs || {};
      const nightly = j["archivist-nightly"];
      parts.push(`<section><p class="eyebrow">Hub <span class="count">${esc(hub.via)} · ${esc(hub.root || "")}</span></p>
        <div class="panel"><div class="hub">
          <div class="cell"><div class="lbl">Last nightly</div><div class="val">${clock(st.generated_at)}</div><div class="note">judged ${st.judged ?? "?"} · kept ${st.new_proposals ?? "?"} · landed ${st.auto_promoted ?? "?"}${nightly ? " · " + Math.round(nightly.dur_s / 60) + " min" : ""}</div></div>
          <div class="cell"><div class="lbl">Waiting at the gate</div><div class="val">${hub.pending ?? "?"}</div><div class="note">${(hub.gears || {}).entity === "ask-first" ? "entities always ask first" : ""}</div></div>
          <div class="cell"><div class="lbl">Outside the nightly window</div><div class="val">${(st.deferred ?? cov.unjudged_in_window ?? "?").toLocaleString()}</div><div class="note">of ${(cov.processable ?? "?").toLocaleString()} in scope, judged newest first</div></div>
          <div class="cell"><div class="lbl">Trusted cards</div><div class="val">${((k.entities || 0) + (k.concepts || 0) + (k.syntheses || 0)).toLocaleString()}</div><div class="note">${k.entities || 0} entities · ${k.concepts || 0} concepts · ${k.syntheses || 0} syntheses</div></div>
          <div class="cell"><div class="lbl">Schedules</div><div class="val" style="font-size:13px;font-weight:500;line-height:1.6">${["archivist-nightly", "daily-health-check", "vault-autocommit"].filter(x => j[x]).map(x => `<span class="dot ${j[x].exit === 0 ? "ok" : "bad"}" style="display:inline-block;margin-right:6px"></span>${esc(x.replace("archivist-", "").replace("daily-", ""))} ${clock(j[x].ts)}`).join("<br>") || "no run log"}</div><div class="note">audit ${esc((hub.audit_latest || "").replace("audit-", "").replace(".md", "") || "none")}</div></div>
        </div>
        <div class="verdicts">${(hub.decisions_tail || []).slice(-6).map(v => `<span>${esc(day(v.ts))} <b>${esc(v.verdict)}</b> ${esc(v.slug.replace(".md", ""))} <span style="opacity:.7">${esc(v.actor)}</span></span>`).join("")}</div>
        </div></section>`);
    } else if (hub.reachable === false) {
      parts.push(`<section><p class="eyebrow">Hub</p><div class="panel"><div class="empty">The hub did not answer: ${esc(hub.error || "")}. Governance state is only trusted from the hub, so nothing here says what landed.</div></div></section>`);
    }

    // tools
    const hs = d.harnesses || [];
    const cards = hs.map(h => {
      const runAge = parseRun(h.last_run), interval = ((h.plist || {}).schedule || "").match(/every (\d+)s/);
      const wdot = wireDot(runAge, interval ? +interval[1] : 900);
      const reads = (h.reads_7d || {}).real || 0;
      const rdot = h.read === "instruction" ? "warn" : h.hook_registered ? (reads > 0 ? "ok" : "warn") : "bad";
      const rlabel = h.read === "instruction" ? "by instruction" : h.hook_registered ? (reads > 0 ? `${reads} read${reads === 1 ? "" : "s"} this week` : "hook set, no read yet") : "hook missing";
      return `<div class="panel tool">
        <div class="top"><h3>${esc(h.name)}</h3><span class="state ${esc(h.state.replace(" ", "-"))}">${esc(h.state)}</span></div>
        <div class="wire read"><span class="glyph">◀ read</span><div class="line ${rdot}"><i></i></div><span class="age" title="${esc(rlabel)}">${esc(h.read === "instruction" ? "auto" : reads)}</span></div>
        <div class="wire write"><span class="glyph">write ▶</span><div class="line ${h.job_loaded ? wdot : "bad"}"><i></i></div><span class="age">${h.job_loaded ? fmtAge(runAge) : "off"}</span></div>
        <div class="dim" style="font-size:11px;color:var(--muted)">lane <code>${esc(h.lane)}</code>${h.job_loaded ? ` · every ${interval ? Math.round(interval[1] / 60) : 15} min` : ""}</div>
        ${h.manual_step && reads === 0 ? `<div class="step">${esc(h.manual_step)}</div>` : ""}
        <div class="actions">
          ${h.job_loaded ? `<button class="small" data-act="kickstart" data-label="${esc(h.label)}">Run mirror now</button>` : ""}
          ${h.lane_dir ? `<button class="small" data-act="reveal" data-path="${esc(h.lane_dir)}">Show lane</button>` : ""}
          <button class="small" data-act="connect" data-harness="${esc(h.id)}">${h.state === "connected" ? "Reinstall" : "Connect"}</button>
        </div></div>`;
    });
    const found = hs.filter(h => h.detected !== false && h.state !== "connected");
    const tf = d.tools_found || [];
    const noConnector = tf.filter(t => t.detected && !t.connector);
    const absent = tf.filter(t => !t.detected && t.connector);
    cards.push(`<div class="panel tool add"><div><strong style="color:var(--ink)">Add a tool</strong><div style="margin:6px 0 10px">${found.length ? `${found.length} tool${found.length === 1 ? "" : "s"} found on this Mac and not connected yet: ${esc(found.map(h => h.name).join(", "))}.` : "Every tool with a connector is connected on this Mac."}</div>
      ${noConnector.length ? `<div style="margin:0 0 10px;font-size:12px"><span style="color:var(--ink)">Also found, no connector yet:</span> ${noConnector.map(t => `<span title="${esc(t.note || "")}">${esc(t.name)}</span>`).join(", ")}</div>` : ""}
      ${absent.length ? `<div style="margin:0 0 10px;font-size:11px;color:var(--muted)">Connectors for tools not on this Mac: ${esc(absent.map(t => t.name).join(", "))}</div>` : ""}
      ${found.length ? `<button class="small primary" id="connect-all" style="margin-bottom:10px">Connect everything found</button><br>` : ""}
      <select id="addsel">${hs.map(h => `<option value="${esc(h.id)}">${esc(h.name)}${h.state === "connected" ? " (connected)" : h.detected === false ? " (not found here)" : ""}</option>`).join("")}</select>
      <button class="small" id="addbtn" style="margin-left:6px">Dry run</button></div></div>`);
    parts.push(`<section><p class="eyebrow">Tools on this Mac <span class="count">${hs.filter(h => h.state === "connected").length} of ${hs.length} connected</span></p><div class="tools">${cards.join("")}</div></section>`);

    // fleet: every host the vault knows about, from the lanes themselves
    const fleet = d.fleet || [];
    const chip = (h) => {
      const r = h.reads_7d > 0 ? "ok" : "warn";
      const w = h.run_age_h == null ? "" : h.run_age_h <= 0.7 ? "ok" : h.run_age_h <= 24 ? "warn" : "bad";
      const pull = h.projects != null ? `${h.projects} project${h.projects === 1 ? "" : "s"}, ${h.md_files} files` : `${h.md_files} files`;
      return `<span class="chip"><b>${esc(h.harness)}</b> <span class="dot ${r}" title="reads this week: ${h.reads_7d}"></span>◀${h.reads_7d} <span class="dot ${w}" title="last mirror run"></span>▶${fmtAge(h.run_age_h)} <span class="dim">${esc(pull)}</span></span>`;
    };
    parts.push(`<section id="fleet"><p class="eyebrow">Fleet <span class="count">${fleet.length} hosts · from the lanes in the vault, no ssh</span></p>
      <div class="panel" style="overflow:auto"><table>
        <tr><th>Host</th><th>Lanes</th><th>Tools deployed · ◀ reads 7d · ▶ last mirror · what it pulls</th><th class="r">Newest</th></tr>
        ${fleet.map(f => {
          const newest = Math.min(...f.lanes.map(l => l.newest_age_h == null ? Infinity : l.newest_age_h));
          const lanesTxt = f.lanes.map(l => `<span title="${esc(l.producer || "")}">${esc(l.lane)}${l.status && l.status !== "onboarded" ? ` <span class="badge">${esc(l.status)}</span>` : ""}</span>`).join("<br>");
          const tools = f.harnesses.length ? f.harnesses.map(chip).join("<br>") : `<span class="dim" style="color:var(--warn)">no tools deployed</span>`;
          return `<tr><td class="name">${esc(f.host)}</td><td class="dim">${lanesTxt}</td><td>${tools}</td><td class="r mono"><span class="age"><span class="dot ${contentDot(isFinite(newest) ? newest : null)}"></span>${fmtAge(isFinite(newest) ? newest : null)}</span></td></tr>`;
        }).join("")}
      </table></div></section>`);

    // wire board
    const lanes = d.lanes || [];
    parts.push(`<section><p class="eyebrow">Wire board <span class="count">${lanes.length} lanes this Mac can see · newest file age</span></p>
      <div class="panel" style="overflow:auto"><table>
        <tr><th>Lane</th><th>Producer</th><th>Read</th><th>Write</th><th class="r">Staging</th><th class="r">Vault</th><th class="r">Hub</th><th class="r">Reads 7d</th></tr>
        ${lanes.map(l => `<tr>
          <td class="name">${esc(l.lane)}</td><td class="dim">${esc(l.producer || "")}</td>
          <td class="dim">${esc((l.read || "none").replace(/\s*\(.*\)$/, ""))}</td><td class="dim">${esc(l.write || "")}</td>
          <td class="r mono"><span class="age"><span class="dot ${contentDot(l.staging_age_h)}"></span>${fmtAge(l.staging_age_h)}</span></td>
          <td class="r mono"><span class="age"><span class="dot ${contentDot(l.vault_age_h)}"></span>${fmtAge(l.vault_age_h)}</span></td>
          <td class="r mono"><span class="age"><span class="dot ${contentDot(l.hub_age_h)}"></span>${fmtAge(l.hub_age_h)}</span></td>
          <td class="r mono">${(l.reads_7d || {}).real || 0}</td></tr>`).join("")}
      </table></div></section>`);

    // jobs
    const jobs = d.jobs || [];
    parts.push(`<section><p class="eyebrow">Jobs on this Mac <span class="count">launchd</span></p>
      <div class="panel" style="overflow:auto"><table>
        <tr><th>Job</th><th>Schedule</th><th class="r">Last exit</th><th class="r">Error log</th><th></th></tr>
        ${jobs.map(j => `<tr><td class="name mono">${esc(j.label)}</td><td class="dim">${esc(j.schedule || "")}</td>
          <td class="r mono"><span class="age"><span class="dot ${j.last_exit === 0 ? "ok" : j.last_exit == null ? "" : "bad"}"></span>${j.last_exit == null ? "–" : j.last_exit}</span></td>
          <td class="r mono">${j.stderr_lines == null ? "–" : j.stderr_lines + (j.stderr_lines === 1 ? " line" : " lines")}</td>
          <td class="r"><button class="small" data-act="kickstart" data-label="${esc(j.label)}">Run now</button>${j.stderr ? ` <button class="small" data-act="open" data-path="${esc(j.stderr)}">Log</button>` : ""}</td></tr>`).join("")}
      </table></div></section>`);

    parts.push(`<footer>Everything on this screen comes from <code>sov status --json</code> on this Mac, plus one ssh call to the hub. The app changes nothing by itself; Connect runs the same <code>sov connect</code> the terminal does.</footer>`);
    $("#main").innerHTML = parts.join("");
  }

  function openDrawer(title, showApply) {
    $("#drawer-title").textContent = title; $("#drawer-log").textContent = ""; $("#drawer-state").textContent = "running";
    $("#drawer-apply").hidden = !showApply; $("#drawer-apply").disabled = true; $("#drawer").classList.add("open");
  }
  function connect(harness, apply, extra) {
    extra = extra || (pendingConnect && pendingConnect.extra) || {};
    pendingConnect = { harness, apply, extra };
    openDrawer(`${apply ? "Installing" : "Dry run:"} ${harness === "all" ? "every tool found on this Mac" : harness}`, !apply);
    bridge(Object.assign({ cmd: "connect", harness, apply: !!apply, host: extra.host || (state && state.machine && state.machine.host) || "" }, extra));
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "refresh") return refresh();
    if (b.id === "drawer-close") { $("#drawer").classList.remove("open"); return; }
    if (b.id === "drawer-apply") { if (pendingConnect) connect(pendingConnect.harness, true); return; }
    if (b.id === "addbtn") { connect($("#addsel").value, false); return; }
    if (b.id === "connect-all") { connect("all", false); return; }
    if (b.id === "setup-dry") {
      const extra = { vault: $("#f-vault").value.trim(), host: $("#f-host").value.trim(), core: $("#f-core").value.trim(), hub: $("#f-hub").value.trim() };
      if (!extra.vault) { $("#f-vault").focus(); return; }
      connect("all", false, extra); return;
    }
    const act = b.dataset.act;
    if (act === "connect") connect(b.dataset.harness, false);
    if (act === "kickstart") { openDrawer("Run now: " + b.dataset.label, false); bridge({ cmd: "kickstart", label: b.dataset.label }); }
    if (act === "reveal") bridge({ cmd: "reveal", path: b.dataset.path });
    if (act === "open") bridge({ cmd: "open", path: b.dataset.path });
  });

  function refresh() { $("#sub").textContent = "refreshing…"; bridge({ cmd: "status" }); }
  window.sovRefresh = refresh;
  window.sovDeliver = function (kind, payload) {
    if (kind === "status") {
      if (payload.error) { $("#main").innerHTML = `<section><div class="panel"><div class="empty">${esc(payload.error)}</div></div></section>`; $("#sub").textContent = "status unavailable"; return; }
      render(payload);
    } else if (kind === "log") {
      const log = $("#drawer-log"); log.textContent += payload.line + "\n"; log.scrollTop = log.scrollHeight;
      if (payload.state === "end") {
        $("#drawer-state").textContent = payload.exit === 0 ? "done" : "exit " + payload.exit;
        if (pendingConnect && !pendingConnect.apply && payload.exit === 0) $("#drawer-apply").disabled = false;
        if (pendingConnect && pendingConnect.apply) { pendingConnect = null; setTimeout(refresh, 800); }
      }
    } else if (kind === "kickstart") {
      $("#drawer-log").textContent += (payload.exit === 0 ? "started " + payload.label : "launchctl exit " + payload.exit + "\n" + payload.out) + "\n";
      $("#drawer-state").textContent = payload.exit === 0 ? "started" : "failed"; setTimeout(refresh, 4000);
    }
  };
  document.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "r") { e.preventDefault(); refresh(); } if (e.key === "Escape") $("#drawer").classList.remove("open"); });
  refresh();
  setInterval(refresh, 60000);
})();
</script>
</body>
</html>
