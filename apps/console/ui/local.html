<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self'">
<title>Sovereign</title><link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:13px/18px var(--sans);-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--ink);padding:7px 12px}button.primary{background:var(--brass);border-color:var(--brass);color:#15181C;font-weight:600}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}button:disabled{opacity:.5;cursor:default}#notice{padding:9px 24px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--rule)}#notice.error{color:var(--down)}.welcome{max-width:560px;margin:70px auto;padding:0 24px}.eyebrow{color:var(--brass-ink);font-size:12px;letter-spacing:.06em;text-transform:uppercase}.welcome h1{font-size:34px;line-height:1.15;font-weight:550;margin:16px 0}.welcome p{color:var(--muted);line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.fine{font-size:12px}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="system-view.css"><link rel="stylesheet" href="app.css"></head><body>
<nav class="shell-rail" aria-label="Primary navigation"></nav>
<header class="top"><h1 id="page-label">Today</h1><span class="grow"></span><span class="controls" id="controls"></span><span class="seen" id="seen"></span><button class="quiet" id="refresh" title="Refresh" aria-label="Refresh">↻</button></header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<section id="system-home" aria-label="Today"></section>
<section class="welcome" id="welcome"><div class="eyebrow">A place for what you learn</div><h1>Keep the work.<br>Carry the knowledge.</h1><p>An archive of plain Markdown files you own.</p><div class="actions"><button class="primary" id="create">Create archive…</button><button id="choose">Open existing archive…</button></div><p class="fine">Nothing is uploaded. No background jobs are installed.</p></section>
<script src="status-model.js"></script><script src="gate-model.js"></script><script src="system-model.js"></script><script src="system-view.js"></script><script src="shell.js"></script><script src="home.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);let root=null,request=0,readRequest=0,contextRequest=0,view="home",stateReady=false,pendingGoto=null,timer=null;
const send=data=>window.webkit.messageHandlers.sov.postMessage(data);
// The notice line exists for failures. Routine state is not announced.
function notice(text,error=false){const n=$('notice');n.textContent=text||'';n.hidden=!text;n.classList.toggle('error',error)}
function local(action,extra={}){const id=++request;send({cmd:'local',action,...extra,request:id});return id}
function refresh(){if(root)contextRequest=local('context');Home.refresh()}
// Review, Sources, Library, Backups and Settings live in the other document.
const elsewhere=place=>send({cmd:'navigate',page:'operations',place});
function setView(next){
 if(next==='review'){send({cmd:'navigate',page:'review'});return false}
 view=next==='system'?'system':'home';
 SovShell.select(view==='system'?'sources':'today');
 Home.view(view==='system'?'system':'overview');
 $('welcome').hidden=!!root||view!=='home';return true;
}
SovShell.mount('today',to=>{
 if(to==='today')return setView('home');
 if(to==='review')return setView('review');
 elsewhere(to==='settings'?{settings:true}:{view:{sources:'sources',library:'archive',backups:'recovery'}[to]});
});
// The page header: where you are, the three faces of Sources when on its map, and when status was read.
function chrome(state){
 const system=state.view==='system';
 $('page-label').textContent=system?'Sources':'Today';
 $('controls').innerHTML=system?'<span class="seg" role="group" aria-label="Sources"><button data-view="sources" aria-pressed="false">Tools</button><button data-view="hosts" aria-pressed="false">Devices</button><button data-view="system" aria-pressed="true">Map</button></span>':'';
 $('seen').textContent=SovStatus.seen(state.status);$('seen').title=SovStatus.caption(state.status);
 $('refresh').disabled=state.pending;
 const s=state.status,name=root?root.split('/').pop():null;
 // Live only when the connected system answered for the archive that is open.
 SovShell.archive(name,!s||s.error||s._status?.error?'':s.machine?.connected&&s.machine.vault===root?'live':'');
}
// Keys 1 to 5 reach the five destinations from here too.
document.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;
 if(/^[1-5]$/.test(e.key))$(['today','review','sources','library','backups'][+e.key-1]+'-tab').click();
});
$('controls').onclick=e=>{const b=e.target.closest('[data-view]');if(b&&b.dataset.view!=='system')elsewhere({view:b.dataset.view})};
$('refresh').onclick=refresh;
Home.init({send,chrome,elsewhere,map:()=>setView('system'),review:()=>setView('review'),openNote:path=>{if(root)readRequest=local('read',{path})},browse:()=>{if(root)send({cmd:'reveal',path:root})}});
$('create').onclick=()=>send({cmd:'chooseArchive',create:true});
$('choose').onclick=()=>send({cmd:'chooseArchive',create:false});
$('change').onclick=()=>send({cmd:'chooseArchive',create:false});
window.sovDeliver=(kind,payload)=>{
 // Settings > Refresh every applies here too: Today is where the window opens and stays.
 if(kind==='settings'){clearInterval(timer);timer=setInterval(()=>{if(stateReady)Home.refresh()},Math.max(15,payload.refresh||60)*1000);return}
 if(kind==='status'){Home.status(payload);return}
 if(kind==='appUpdateResult'){
  // Failed builds return a terminal result while this app remains open.
  const m=payload.error||(payload.state==='cancelled'?'Cancelled. Nothing was changed.':payload.verification||'Refresh to see the installed version.');
  notice(m,!!payload.error);
  if(payload.state&&payload.state!=='started')setTimeout(()=>Home.refresh(),1500);
  return;
 }
 if(kind==='goto'){if(!stateReady){pendingGoto=payload;return}if(payload.chooseArchive)window.sovChooseArchive(payload.create===true);else setView(payload.view||'home');return}
 if(kind==='localState'){
   stateReady=true;root=payload.root||null;readRequest=++request;contextRequest=++request;
   $('welcome').hidden=!!root;
   Home.archive(root);view='home';setView('home');
   if(root){notice('');refresh()}else {Home.refresh();notice(payload.error||'',!!payload.error)}if(pendingGoto){const next=pendingGoto;pendingGoto=null;window.sovDeliver('goto',next)}return;
 }
 if(kind!=='local')return;
 if(payload.action==='context'){if(payload.request===contextRequest)Home.context(payload);return}
 if(payload.action==='read'&&payload.request!==readRequest)return;
 if(payload.error){notice(payload.error,true);return}
 // The archive engine validates the relative path before handing it to the editor.
 if(payload.action==='read'&&root&&payload.path)send({cmd:'open',path:root+'/'+payload.path});
};
window.sovRefresh=refresh;
window.sovSnapshotReady=()=>stateReady;
window.sovView=value=>{if(value==='today')value='home';if(['home','system','review'].includes(value))return setView(value);return false};
window.sovCanQuit=()=>true;
window.sovChooseArchive=create=>send({cmd:'chooseArchive',create});
window.onerror=()=>notice('The archive view encountered an error. Reopen the window to retry.',true);
send({cmd:'localState'});
send({cmd:'settings'});
</script></body></html>
