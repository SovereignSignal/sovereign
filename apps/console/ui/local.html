<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self'">
<title>Sovereign</title><link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:13px/18px var(--sans);-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--ink);padding:7px 12px}button.primary{background:var(--brass);border-color:var(--brass);color:#15181C;font-weight:600}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}button:disabled{opacity:.5;cursor:default}#notice{padding:9px 24px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--rule)}#notice.error{color:var(--down)}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

/* First launch is a page of its own: no rail and no header until an archive is open. */
body.first-run{display:flex;flex-direction:column}
body.first-run>.shell-rail,body.first-run>.top,body.first-run>#system-home{display:none}
.first-page{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.first-card{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.first-card .mark{color:var(--brass)}
.first-card h1{margin:0;font:600 26px/32px var(--sans);letter-spacing:-.01em}
.first-page .lead{margin:0;color:var(--ink-2);font-size:14px;line-height:20px}
.first-card .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
.first-card .actions button{min-height:36px;padding:6px 16px}
.first-card .fine{margin:6px 0 0;color:var(--faint);font-size:12px}
.connect-card{width:min(460px,100%);display:flex;flex-direction:column;gap:16px}
.connect-card .ready{display:flex;align-items:center;gap:10px;min-width:0}
.connect-card .ready .health-dot{width:8px;height:8px}
.connect-card h1{margin:0;font:600 20px/26px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.connect-card .lead{margin:-8px 0 0 18px;font-size:var(--t-body);line-height:var(--lh-body)}
.connect-card .cap{margin-top:6px;font:10.5px/14px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.connect-rows{border-top:1px solid var(--rule-soft)}
.connect-row{display:grid;grid-template-columns:minmax(0,1fr) auto 100px;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--rule-soft)}
.connect-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.connect-row .name small{margin-left:8px;color:var(--muted);font-size:11px}
.connect-row .where{font:12px/16px var(--mono);color:var(--muted)}
.connect-row button{min-height:30px;padding:4px 10px}
.connect-empty{margin:0;padding:12px 0;color:var(--muted);border-bottom:1px solid var(--rule-soft)}
.connect-end{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.connect-end button{min-height:30px;padding:4px 14px}
.connect-end .link{border-color:transparent;background:transparent;color:var(--muted);padding-left:0}
.connect-end .link:hover{color:var(--ink);filter:none}
</style><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="system-view.css"><link rel="stylesheet" href="app.css"></head><body>
<nav class="shell-rail" aria-label="Primary navigation"></nav>
<header class="top"><h1 id="page-label">Today</h1><span class="sub" id="summary"></span><span class="grow"></span><span class="controls" id="controls"></span><span class="seen" id="seen"></span><button class="quiet" id="refresh" title="Refresh" aria-label="Refresh">↻</button></header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<section id="system-home" aria-label="Today"></section>
<section class="welcome first-page" id="welcome" aria-labelledby="welcome-title" hidden><div class="first-card"><svg class="mark" width="40" height="40" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 5.2 5.1 8.9 8 3.4l2.9 5.5L14 5.2l-.9 7.3H2.9L2 5.2zM3.1 13.2h9.8v1.2H3.1z"/></svg><h1 id="welcome-title">Sovereign</h1><p class="lead">Keep what you learn as plain files you own.</p><div class="actions"><button class="primary" id="create">Create archive…</button><button id="choose">Open existing…</button></div><p class="fine">Nothing leaves this Mac.</p></div></section>
<section class="first-page" id="connect" aria-labelledby="connect-title" hidden><div class="connect-card"><div class="ready"><i class="health-dot live"></i><h1 id="connect-title"></h1></div><p class="lead">Connect the tools you use so they read it and add to it.</p><div class="cap" id="connect-cap">Found on this Mac</div><div class="connect-rows" id="connect-rows"></div><div class="connect-end"><button class="link" id="connect-skip">Skip for now</button><button id="connect-done">Done</button></div></div></section>
<script src="status-model.js"></script><script src="gate-model.js"></script><script src="system-model.js"></script><script src="system-view.js"></script><script src="discovery-model.js"></script><script src="shell.js"></script><script src="home.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);let root=null,request=0,readRequest=0,contextRequest=0,view="home",stateReady=false,pendingGoto=null,timer=null;
const send=data=>window.webkit.messageHandlers.sov.postMessage(data);
// The notice line exists for failures. Routine state is not announced.
function notice(text,error=false){const n=$('notice');n.textContent=text||'';n.hidden=!text;n.classList.toggle('error',error)}
function local(action,extra={}){const id=++request;send({cmd:'local',action,...extra,request:id});return id}
function refresh(){if(root)contextRequest=local('context');Home.refresh()}
// Review, Sources, Library, Backups and Settings live in the other document.
const elsewhere=place=>send({cmd:'navigate',page:'operations',place});
// With no archive open, Today is the first-launch page; the rail and header return with an archive.
function frame(){
 $('welcome').hidden=!!root||view!=='home';$('connect').hidden=!connect||view!=='home';
 document.body.classList.toggle('first-run',$('welcome').hidden===false||$('connect').hidden===false);
}
function setView(next){
 if(next==='review'){endConnect();send({cmd:'navigate',page:'review'});return false}
 view=next==='system'?'system':'home';if(view!=='home')endConnect();
 SovShell.select(view==='system'?'sources':'today');
 Home.view(view==='system'?'system':'overview');
 frame();return true;
}
// The connect step follows a fresh create or open, once per archive, while no tool feeds it.
// It reads the bundled discovery scan; connecting itself happens in Sources, with its preview.
let connect=null;
function startConnect(at){
 const request='first-run:'+Date.now()+Math.random();connect={root:at,request,scan:null,status:null,seen:false};
 $('connect-title').textContent=at.split('/').pop()+' is ready';
 send({cmd:'discover',request});
 setTimeout(()=>{if(connect?.request===request&&!connect.scan){connect.scan={error:true};drawConnect()}},12000);
 drawConnect();
}
function seenConnect(){if(connect&&!connect.seen){connect.seen=true;send({cmd:'connectSeen',root:connect.root})}}
function endConnect(seen){if(!connect)return;if(seen)seenConnect();connect=null;frame()}
function connectStatus(s){
 if(!connect||s?._status?.pending)return;
 const mine=!!s&&!s.error&&!s._status?.error&&s.machine?.connected&&s.machine.vault===connect.root;
 // An archive that already has a tool connected goes straight to Today.
 if(mine&&(s.harnesses||[]).some(SovDiscovery.active)){endConnect();return}
 connect.status=mine?s:null;connect.host=s?.machine?.host||'';seenConnect();drawConnect();
}
function drawConnect(){
 const box=$('connect-rows');if(!connect)return;
 const empty=text=>{const p=document.createElement('p');p.className='connect-empty';p.textContent=text;box.replaceChildren(p)};
 if(!connect.scan)return empty('Looking…');
 if(connect.scan.error)return empty('Could not look for tools. Add them later in Sources.');
 const tools=SovDiscovery.candidates(connect.scan,connect.status).filter(t=>t.connector&&!t.cloud&&(t.installed||t.detected)&&!t.active);
 if(!tools.length)return empty('No tools found. Add them later in Sources.');
 box.replaceChildren(...tools.map((t,i)=>{
  const row=document.createElement('div'),name=document.createElement('span'),where=document.createElement('span'),go=document.createElement('button');
  row.className='connect-row';name.className='name';name.textContent=t.name;where.className='where';where.textContent=connect.host;
  // Saved configuration alone may outlive the tool; say so on the row.
  if(!t.installed){const note=document.createElement('small');note.textContent='config only';name.append(note)}
  go.textContent='Connect…';if(i===0)go.className='primary';go.setAttribute('aria-label','Connect '+t.name);
  go.onclick=()=>{seenConnect();connect=null;elsewhere({view:'discover',sel:{id:t.id}})};
  row.append(name,where,go);return row;
 }));
}
$('connect-skip').onclick=$('connect-done').onclick=()=>endConnect(true);
SovShell.mount('today',to=>{
 if(to==='today')return setView('home');
 if(to==='review')return setView('review');
 elsewhere(to==='settings'?{settings:true}:{view:{sources:'sources',library:'archive',backups:'recovery'}[to]});
});
// The page header: where you are, what the Map holds, the three faces of Sources when on its map, and when status was read.
function chrome(state){
 const system=state.view==='system';
 $('page-label').textContent=system?'Sources':'Today';
 $('summary').textContent=system?SystemView.summary({root,status:state.status}):'';
 $('controls').innerHTML=system?'<span class="seg" role="group" aria-label="Sources"><button data-view="sources" aria-pressed="false">Tools</button><button data-view="hosts" aria-pressed="false">Devices</button><button data-view="system" aria-pressed="true">Map</button></span>':'';
 $('seen').textContent=SovStatus.seen(state.status);$('seen').title=SovStatus.caption(state.status);
 $('refresh').disabled=state.pending;
 const s=state.status,name=root?root.split('/').pop():null;
 // Live only when the connected system answered for the archive that is open.
 SovShell.archive(name,!s||s.error||s._status?.error?'':s.machine?.connected&&s.machine.vault===root?'live':'');
}
// Keys 1 to 5 reach the five destinations from here too.
document.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)||document.body.classList.contains('first-run'))return;
 if(/^[1-5]$/.test(e.key))$(['today','review','sources','library','backups'][+e.key-1]+'-tab').click();
});
$('controls').onclick=e=>{const b=e.target.closest('[data-view]');if(b&&b.dataset.view!=='system')elsewhere({view:b.dataset.view})};
$('refresh').onclick=refresh;
Home.init({send,chrome,elsewhere,map:()=>setView('system'),review:()=>setView('review'),openNote:path=>{if(root)readRequest=local('read',{path})},browse:()=>{if(root)send({cmd:'reveal',path:root})}});
$('create').onclick=()=>send({cmd:'chooseArchive',create:true});
$('choose').onclick=()=>send({cmd:'chooseArchive',create:false});
$('change').onclick=()=>send({cmd:'chooseArchive',create:false});
window.sovDeliver=(kind,payload)=>{
 // Settings > Refresh every applies here too: Today is where the window opens and stays.
 if(kind==='settings'){clearInterval(timer);timer=setInterval(()=>{if(stateReady)Home.refresh()},Math.max(15,payload.refresh||60)*1000);return}
 if(kind==='status'){Home.status(payload);connectStatus(payload);return}
 if(kind==='discovery'){if(connect&&payload.request===connect.request){connect.scan=payload.error?{error:true}:payload;drawConnect()}return}
 if(kind==='appUpdateResult'){
  // Failed builds return a terminal result while this app remains open.
  const m=payload.error||(payload.state==='cancelled'?'Cancelled. Nothing was changed.':payload.verification||'Refresh to see the installed version.');
  notice(m,!!payload.error);
  if(payload.state&&payload.state!=='started')setTimeout(()=>Home.refresh(),1500);
  return;
 }
 if(kind==='goto'){if(!stateReady){pendingGoto=payload;return}if(payload.chooseArchive)window.sovChooseArchive(payload.create===true);else setView(payload.view||'home');return}
 if(kind==='localState'){
   stateReady=true;root=payload.root||null;readRequest=++request;contextRequest=++request;
   connect=null;view='home';if(root&&payload.chosen&&!payload.connectSeen)startConnect(root);
   Home.archive(root);setView('home');
   if(root){notice('');refresh()}else {Home.refresh();notice(payload.error||'',!!payload.error)}if(pendingGoto){const next=pendingGoto;pendingGoto=null;window.sovDeliver('goto',next)}return;
 }
 if(kind!=='local')return;
 if(payload.action==='context'){if(payload.request===contextRequest)Home.context(payload);return}
 if(payload.action==='read'&&payload.request!==readRequest)return;
 if(payload.error){notice(payload.error,true);return}
 // The archive engine validates the relative path before handing it to the editor.
 if(payload.action==='read'&&root&&payload.path)send({cmd:'open',path:root+'/'+payload.path});
};
window.sovRefresh=refresh;
window.sovSnapshotReady=()=>stateReady;
window.sovView=value=>{if(value==='today')value='home';if(['home','system','review'].includes(value))return setView(value);return false};
window.sovCanQuit=()=>true;
window.sovChooseArchive=create=>send({cmd:'chooseArchive',create});
window.onerror=()=>notice('The archive view encountered an error. Reopen the window to retry.',true);
send({cmd:'localState'});
send({cmd:'settings'});
</script></body></html>
