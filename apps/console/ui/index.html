<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sovereign</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="tokens.css">
<style>
  /* Instrument panel: graphite and brass. Structure and data are monospaced; prose is
     the only proportional type. At rest the app is a pulse line and a list, nothing
     else. Every record is one line; detail lives in a drawer that opens on click and
     leaves when dismissed, so the resting state stays small. The wire strip is the
     signature: one dual-segment mark per tool, read on the left, write on the right. */
  /* palette, type, space: apps/console/design/tokens.css (copied beside this file at build) */
  :root { --series-4: var(--faint); --tag-rule: var(--rule); --col-shadow: var(--shadow); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tag-rule: var(--rule-soft); --col-shadow: none; } }
  :root[data-theme="dark"] { --tag-rule: var(--rule-soft); --col-shadow: none; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
    font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: 500 12px var(--sans); color: var(--ink-2); background: var(--panel);
    border: 1px solid var(--rule); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--faint); color: var(--ink); }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  button.brass { background: var(--brass); border-color: var(--brass); color: #17140A; font-weight: 600; }
  button.danger { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, transparent); }
  button.danger.confirm { background: var(--down); border-color: var(--down); color: #fff; }
  button.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 2px 6px; }
  button[disabled] { opacity: .45; cursor: default; }
  label { display: block; font-size: 12px; color: var(--ink-2); }
  input { font: 12px var(--mono); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px;
    background: var(--sunk); color: var(--ink); width: 100%; margin: 4px 0 10px; }
  input:focus-visible { outline: 2px solid var(--brass); outline-offset: 0; border-color: transparent; }
  .mono { font-family: var(--mono); font-size: 11.5px; letter-spacing: -0.01em; }
  .num, .val, .n, .tile b { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .crown { width: 16px; height: 16px; color: var(--ink); flex: none; }
  /* The status line appears only when status itself failed; a healthy app has no banner. */
  #verdict { display: none; align-items: center; gap: var(--s2); padding: 9px 24px;
    background: var(--panel); border-bottom: 1px solid var(--rule-soft); box-shadow: inset 3px 0 0 var(--down); }
  #verdict.show { display: flex; }
  #verdict .vdot { width: 8px; height: 8px; border-radius: 50%; background: var(--down); flex: none; }
  #verdict .vtext { flex: 1; min-width: 0; font: 500 12.5px/18px var(--sans); color: var(--ink); overflow-wrap: anywhere; }
  .hubpill { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-2); background: var(--panel); border: 1px solid var(--rule); border-radius: 999px;
    padding: 3px 10px; white-space: nowrap; }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); flex: none; display: inline-block; }
  .dot.live { background: var(--live); } .dot.warn { background: var(--warn); }
  .dot.down { background: var(--down); }


  main { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; position: relative; }
  body.pinned main { grid-template-columns: 1fr var(--drawer); }
  #listpane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { flex: none; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 16px;
    border-bottom: 1px solid var(--rule-soft); }
  .seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--rule); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 2px 10px; border-radius: 5px;
    font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .bar .count { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-left: auto; white-space: nowrap; }

  #rows { overflow: auto; flex: 1; -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); }
  #rows.home { overflow: hidden; -webkit-mask-image: none; }
  #rows:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--brass); }
  .row { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 12px 0 16px;
    border-bottom: 1px solid var(--rule-soft); cursor: pointer; position: relative; }
  .row:hover { background: var(--sunk); }
  .row[aria-selected="true"] { background: var(--sel); }
  .row[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--brass); }
  .row.head { height: 26px; cursor: default; background: var(--ground); position: sticky; top: 0; z-index: 1;
    border-bottom: 1px solid var(--rule); }
  .row.head:hover { background: var(--ground); }
  .row.head { height: 28px; }
  .row.head .name { color: var(--muted); font: 500 var(--t-caption)/var(--lh-caption) var(--mono); text-transform: uppercase; letter-spacing: .04em; width: auto; }
  .row.head .num { color: var(--ink-2); }
  .row.head .num { color: var(--faint); }
  .row.quiet { cursor: default; color: var(--muted); font-size: 12px; }
  .row.quiet:hover { background: transparent; }
  .row .name { font-family: var(--mono); font-size: 12px; font-weight: 500; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; flex: none; }
  .row .desc { flex: 1; min-width: 0; font: var(--t-body)/var(--lh-body) var(--sans); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .num { font: var(--t-caption)/var(--lh-caption) var(--mono); color: var(--faint); text-align: right; white-space: nowrap; flex: none; }
  .row .chev { color: var(--faint); font-size: 11px; width: 8px; flex: none; }
  .row .tag { font-family: var(--mono); font-size: var(--t-caption); line-height: 14px; height: 16px; color: var(--faint); border: 1px solid var(--tag-rule); border-radius: var(--radius-tag);
    border-radius: 4px; padding: 0 5px; line-height: 15px; white-space: nowrap; flex: none; }
  .row .tag.on { color: var(--live); border-color: color-mix(in srgb, var(--live) 40%, transparent); }
  .row .tag.mid { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .row .tag.off { color: var(--down); border-color: color-mix(in srgb, var(--down) 40%, transparent); }
  .row .tag.hold { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 45%, transparent); }

  .strip { display: inline-flex; gap: 3px; align-items: center; flex: none; }
  .wm { display: inline-flex; gap: 1px; }
  .wm i { display: block; width: 5px; height: 11px; background: var(--idle); }
  .wm i:first-child { border-radius: 2px 1px 1px 2px; }
  .wm i:last-child { border-radius: 1px 2px 2px 1px; }
  .wm i.live { background: var(--live); } .wm i.warn { background: var(--warn); } .wm i.down { background: var(--down); }
  .wm i.none { background: transparent; border: 1px solid var(--rule); box-sizing: border-box; }
  .strip .none { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

  /* a share of something, as a thin bar: brass by default, a series color when the row is a series */
  .meter { width: 72px; height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; flex: none; }
  .meter i { display: block; height: 100%; background: var(--brass); border-radius: 2px; }
  .meter i.s1 { background: var(--series-1); } .meter i.s2 { background: var(--series-2); } .meter i.s3 { background: var(--series-3); } .meter i.s4 { background: var(--series-4); }
  .meter i.live { background: var(--live); } .meter i.warn { background: var(--warn); } .meter i.down { background: var(--down); }
  .contrib { display: inline-flex; align-items: center; gap: 6px; flex: none; width: 82px; justify-content: flex-end; }
  .contrib .meter { width: 40px; }
  .contrib .n { font-family: var(--mono); font-size: 11px; color: var(--ink-2); min-width: 30px; text-align: right; }
  .contrib .n.zero { color: var(--faint); }
  .cards { display: flex; flex-wrap: wrap; gap: 5px; }

  /* the drawer: hidden at rest, over the list on demand, docked when pinned */
  #inspector { position: absolute; top: 0; right: 0; bottom: 0; width: min(var(--drawer), 92vw); overflow: auto;
    background: var(--panel); border-left: 1px solid var(--rule); box-shadow: var(--shadow);
    transform: translateX(102%); transition: transform var(--dur) var(--ease); z-index: 20; }
  #inspector.open { transform: none; }
  body.pinned #inspector { position: static; transform: none; box-shadow: none; width: auto; }
  #inspector .pad { padding: 12px 16px 12px; }
  #inspector .acts { position: sticky; bottom: 0; background: var(--panel); padding: 8px 0 12px; border-top: 1px solid var(--rule-soft); }
  .insp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .insp-head .sp { flex: 1; }
  .insp-title { font: 600 14px var(--mono); letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .insp-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge { display: inline-block; font-family: var(--mono); font-size: 9.5px; color: var(--brass);
    border: 1px solid color-mix(in srgb, var(--brass) 45%, transparent); border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: 2px; }
  .sect { margin-top: 16px; }
  .sect > h2 { margin: 0 0 6px; font: 500 10.5px var(--mono); color: var(--faint); }
  .kv { display: grid; grid-template-columns: 82px 1fr; gap: 3px 10px; font-size: 12px; margin: 0; }
  .kv dt { font-family: var(--mono); font-size: 10.5px; color: var(--faint); padding-top: 1px; }
  .kv dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
  .tool { border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; }
  .tool .top { display: flex; align-items: center; gap: 8px; }
  .tool .top b { font: 600 12px var(--mono); }
  .tool .top .sp { flex: 1; }
  .wire { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .wire .lab { width: 54px; color: var(--ink-2); flex: none; white-space: nowrap; }
  .wire .track { flex: 1; height: 3px; border-radius: 2px; background: var(--rule); position: relative; }
  .wire .track i { position: absolute; inset: 0; border-radius: 2px; background: var(--idle); }
  .wire .track i.live { background: var(--live); } .wire .track i.warn { background: var(--warn); } .wire .track i.down { background: var(--down); }
  .wire .track i.none { background: transparent; }
  .wire .v { width: 96px; text-align: right; color: var(--ink-2); flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pulls { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-top: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); background: var(--sunk);
    border: 1px solid var(--rule); border-radius: 5px; padding: 2px 7px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { border-color: var(--faint); }
  .chip .dot { margin-right: 5px; }
  .note { font-size: 12px; color: var(--brass-ink); background: var(--brass-wash); border-radius: 7px; padding: 7px 9px; margin-top: 7px; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .empty { color: var(--muted); font-size: 12px; padding: 40px 18px; text-align: center; }
  .prose { font-size: 12px; color: var(--ink-2); }
  .card-body { font-size: 12px; color: var(--ink-2); line-height: 1.5; max-height: 42vh; overflow: auto;
    border: 1px solid var(--rule); border-radius: 8px; padding: 9px 11px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .stack { display: flex; height: 8px; border-radius: 3px; overflow: hidden; gap: 2px; margin: 6px 0 4px; }
  .stack i { display: block; height: 100%; min-width: 2px; }
  .stack i.s1 { background: var(--series-1); } .stack i.s2 { background: var(--series-2); } .stack i.s3 { background: var(--series-3); } .stack i.s4 { background: var(--series-4); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend i.s1 { background: var(--series-1); } .legend i.s2 { background: var(--series-2); } .legend i.s3 { background: var(--series-3); } .legend i.s4 { background: var(--series-4); }
  table.t { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  table.t th, table.t td { text-align: left; padding: 3px 6px 3px 0; border-bottom: 1px solid var(--rule-soft); }
  table.t th { font: 500 10.5px var(--mono); color: var(--faint); }
  table.t td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .nav { display: inline-flex; gap: 2px; margin-right: 2px; }
  .nav button { padding: 2px 6px; font-size: 11px; }
  .row.head .tri { font-style: normal; display: inline-block; width: 12px; color: var(--faint); }
  .row.head:hover { background: var(--sunk); cursor: pointer; }

  /* Glance: the small box. The same page, loaded with #glance, in a menu-bar popover. */
  #glance { display: none; }
  body.glance header, body.glance main, body.glance #drawer, body.glance #verdict { display: none; }
  body.glance #glance { display: flex; flex-direction: column; height: 100%; }
  body.glance.qa #glance { padding-top: 22px; }
  .g-head { display: flex; align-items: center; gap: var(--s2); height: 40px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--rule-soft); }
  .g-head .crown { color: var(--ink); }
  .g-head b { font: 600 var(--t-title)/var(--lh-title) var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .g-row.verdict { height: auto; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--rule-soft); align-items: flex-start; }
  .g-row.verdict .vdot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex: none; background: var(--idle);
    box-shadow: 0 0 0 1px var(--panel), 0 0 0 2px color-mix(in srgb, var(--idle) 30%, transparent); }
  .g-row.verdict.live .vdot { background: var(--live); box-shadow: 0 0 0 1px var(--panel), 0 0 0 2px color-mix(in srgb, var(--live) 30%, transparent); }
  .g-row.verdict.warn .vdot { background: var(--warn); box-shadow: 0 0 0 1px var(--panel), 0 0 0 2px color-mix(in srgb, var(--warn) 30%, transparent); }
  .g-row.verdict.down .vdot { background: var(--down); box-shadow: 0 0 0 1px var(--panel), 0 0 0 2px color-mix(in srgb, var(--down) 30%, transparent); }
  .g-row.verdict .vt { font: 500 var(--t-body)/var(--lh-body) var(--sans); color: var(--ink); white-space: normal; text-align: left; }
  .g-row.verdict.down { box-shadow: inset 3px 0 0 var(--down); }
  .g-head .sp, .g-foot .sp { flex: 1; }
  .g-rows { flex: 1; overflow: auto; }
  .g-row { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 14px; border: 0;
    border-bottom: 1px solid var(--rule-soft); border-radius: 0; background: transparent; text-align: left;
    font-family: var(--mono); color: var(--ink-2); }
  .g-row:hover { background: var(--sunk); }
  .g-row .l { font: var(--t-caption)/var(--lh-caption) var(--mono); color: var(--faint); width: 84px; flex: none; }
  .g-row b { font: 600 var(--t-title)/var(--lh-title) var(--mono); letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
  .g-row .s { font-size: 10.5px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
  .g-row .s.wrap { white-space: normal; line-height: 1.3; font-family: var(--sans); font-size: 11.5px; color: var(--brass-ink); }
  .g-row.hot b { color: var(--brass); }
  .g-row.need { background: var(--brass-wash); height: auto; padding: 8px 14px; }
  .g-foot { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 14px; border-top: 1px solid var(--rule-soft); }
  .g-foot button.brass { background: transparent; border-color: transparent; color: var(--brass); font-weight: 600; padding: 2px 6px; }
  .g-foot button.brass:hover { background: var(--brass-wash); }
  .g-foot .meta { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  select { font: 12px var(--sans); color: var(--ink); background: var(--sunk); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; }
  label.radio, label.check { display: flex; align-items: center; gap: 7px; padding: 3px 0; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  label.radio input, label.check input { width: auto; margin: 0; }
  @media (max-width: 900px) { #pulse .tile .s { display: none; } }

  .insp input.secret { width: 100%; box-sizing: border-box; font: 12px var(--mono); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sunk); color: var(--ink); }
  .insp input.secret:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
  .insp .secret-help { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.45; }

  .ha { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .ha label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
  .ha input { font: 12px var(--mono); padding: 5px 7px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sunk); color: var(--ink); }
  .code-line { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sunk); }
  .code-line code { flex: 1; font: 12px var(--mono); color: var(--ink); user-select: all; -webkit-user-select: all; }

  #drawer { position: fixed; left: 0; right: 0; bottom: 0; transform: translateY(100%);
    transition: transform var(--dur) var(--ease); background: var(--panel); border-top: 1px solid var(--rule); box-shadow: var(--shadow); z-index: 30; }
  #drawer.open { transform: none; }
  #drawer .bar { padding: 0 16px; }
  #drawer b { font: 600 12px var(--mono); }
  #drawer pre { margin: 0; padding: 10px 16px 14px; max-height: 220px; overflow: auto;
    font-family: var(--mono); font-size: 11px; line-height: 1.5; white-space: pre-wrap; color: var(--ink-2); }
  #drawer .state { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .meter i, .hbar .track i { transition: width var(--dur-slow) var(--ease); }
  .row:focus-visible, #rows:focus-visible .row[aria-selected="true"] { outline: 2px solid color-mix(in srgb, var(--brass) 60%, transparent); outline-offset: -2px; }
  @media (prefers-reduced-motion: reduce) { #drawer, #inspector, .meter i, .hbar .track i { transition: none; } }
  body.qa #drawer, body.qa #inspector, body.qa .meter i, body.qa .hbar .track i { transition: none; }   /* snapshot QA: an occluded web view gets no animation frames */
  #device-dialog { width:min(420px,calc(100vw - 64px)); padding:24px; border:1px solid var(--rule); border-radius:12px; background:var(--panel); color:var(--ink); }
  #device-dialog::backdrop { background:rgba(0,0,0,.35); }
  #device-dialog h2 { margin:0 0 12px; font-size:18px; }
  #device-dialog p { font-size:13px; line-height:1.5; }
  #device-dialog .acts { justify-content:flex-end; }
  #device-association-message { color:var(--down); }
.discovery-toolbar{padding:16px;border-bottom:1px solid var(--rule)}
.discovery-toolbar h2{margin:0 0 8px;font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0}
.discovery-toolbar .acts{display:flex;flex-wrap:wrap;gap:8px}
.discovery-toolbar input{flex:1;min-width:130px;width:160px;margin:0}
.discovery-toolbar select{width:auto;max-width:100%;margin:0}
.discovery-caption{font-size:12px;color:var(--muted);margin:10px 0 0}
.discovery-evidence{font-size:12px}.discovery-evidence span{display:block;color:var(--muted)}
.discovery-evidence code{overflow-wrap:anywhere;font-size:11px}
.discovery-row{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px}
.discovery-name{flex:1;min-width:0}.discovery-name strong{display:block;font:500 13px/1.5 var(--sans)}
.discovery-name small{display:block;font:11px/1.5 var(--sans);color:var(--muted)}
@media(min-width:950px){body.discovering main:has(#inspector.open){grid-template-columns:minmax(0,1fr) 380px}body.discovering #inspector.open{position:static;transform:none;width:auto}}
body.hub-setup main,body.hub-setup.pinned main{grid-template-columns:1fr}body.hub-setup #inspector{display:none}
.hub-form{max-width:800px;margin:0 auto;padding:24px;white-space:normal}.hub-form h2{font:550 22px/1.3 var(--sans);text-transform:none;letter-spacing:0;color:var(--ink)}
.hub-form p{font:13px/1.6 var(--sans);color:var(--muted)}.hub-form .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hub-form label{display:block;font:12px/1.5 var(--sans)}.hub-form input,.hub-form select{width:100%}.hub-form pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.5 var(--mono);padding:14px;background:var(--sunk);max-height:300px;overflow:auto}.hub-form ul{font:13px/1.6 var(--sans);padding-left:20px;overflow-wrap:anywhere}.hub-form summary{cursor:pointer;font:12px/1.6 var(--sans);color:var(--muted)}.hub-form .acts{display:flex;gap:8px;flex-wrap:wrap}.hub-form .check{display:flex;gap:8px}.hub-form input[type=checkbox]{width:auto}@media(max-width:760px){.hub-form .fields{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="operations-shell.css">
<link rel="stylesheet" href="settings-view.css">
<link rel="stylesheet" href="archive-backups.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<nav class="shell-rail" aria-label="Primary navigation"></nav>
<header class="top" id="operations-bar">
  <h1 id="vault">Sovereign</h1><span class="sub" id="listcount"></span><span class="grow"></span>
  <span class="controls" id="controls"></span><span class="seen" id="vmeta"></span>
  <button class="quiet" id="refresh" title="Refresh (⌘R)" aria-label="Refresh">↻</button>
</header>

<div id="verdict" role="status"><span class="vdot"></span><span class="vtext" id="vtext"></span></div>
<div id="glance" hidden></div>
<div id="gate-notice" role="status" aria-live="polite" hidden></div>

<main>
  <div id="listpane">
    <section id="review-intro" aria-label="Review queue" hidden></section>
    <div id="rows" role="listbox" tabindex="0" aria-label="Records"></div>
  </div>
  <aside id="inspector" aria-label="Detail"><div class="pad" id="insp"></div></aside>
</main>

<div id="drawer">
  <div class="bar"><b id="drawer-title">Output</b><span class="state" id="drawer-state"></span>
    <span style="flex:1"></span>
    <button class="brass" id="drawer-apply" hidden>Install</button>
    <button id="drawer-close">Close</button></div>
  <pre id="drawer-log"></pre>
</div>

<script src="status-model.js"></script>
<script src="shell.js"></script>
<script src="gate-model.js"></script>
<script src="discovery-model.js"></script>
<script src="hub-setup.js"></script>
<script src="archive-backups.js"></script>
<script src="settings-view.js"></script>
<dialog id="device-dialog" aria-labelledby="device-dialog-title" aria-describedby="device-dialog-description">
  <h2 id="device-dialog-title">Disassociate device?</h2>
  <p id="device-dialog-description"></p>
  <p>Past notes stay in the archive. You can restore this device from Disassociated devices.</p>
  <p class="secret-help">Saved for this archive on this Mac. Device access, collection jobs and external fleet alerts keep their own settings.</p>
  <p id="device-association-message" role="status"></p>
  <div class="acts"><button id="device-cancel" autofocus>Cancel</button><button class="brass" id="device-confirm">Disassociate</button></div>
</dialog>
<script>
// A script error must never be a blank page: paint it where the eye lands.
window.onerror = function (msg, src, line, col) {
  var g = document.getElementById("glance") || document.getElementById("insp");
  if (g) { g.hidden = false; g.innerHTML += '<div class="empty" style="color:var(--down)">Script error: ' + String(msg) + ' at ' + line + ':' + col + '</div>'; }
  var c = document.getElementById("listcount"); if (c) c.textContent = "script error " + line + ":" + col + " " + String(msg).slice(0, 80);
};
(function () {
  const $ = (s, r) => (r || document).querySelector(s);
  const bridge = (m) => { try { window.webkit.messageHandlers.sov.postMessage(m); } catch (e) { console.warn("no bridge", e); } };
  let pendingGoto = null, selectedRoot = null, archiveKnown = false;
  const reviewQueue = () => GateModel.queue(D, selectedRoot, archiveKnown);
  const canReview = slug => view === "review" && reviewQueue().proposals.some(p => p.slug === slug);
  let D = null, view = "sources", sel = null, pendingConnect = null, pinned = false, armed = null;
  const GLANCE = location.hash.startsWith("#glance");
  document.body.classList.toggle("glance", GLANCE);
  if (location.hash === "#glance-qa") document.body.classList.add("qa");
  let S = { where: "dock", loginItem: false, refresh: 60, defaultView: "archive", loginState: "unavailable" };
  let gotSettings = false, timer = null, settingsOpen = false, domIdentity = null;
  const hist = { stack: [], i: -1 };
  try { pinned = localStorage.getItem("sov.pinned") === "1"; } catch (e) {}
  document.body.classList.toggle("pinned", pinned);

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const age = (h) => h == null ? "–" : h < 1 ? Math.max(1, Math.round(h * 60)) + "m" : h < 48 ? (Math.round(h * 10) / 10) + "h" : Math.round(h / 24) + "d";
  const clock = (iso) => { if (!iso) return "?"; const d = new Date(iso); return isNaN(d) ? String(iso).slice(11, 16) : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
  const num = (n) => n == null ? "?" : Number(n).toLocaleString();
  const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
  const freshDot = (h) => h == null ? "" : h <= 24 ? "live" : h <= 168 ? "warn" : "";
  const runDot = (h, iv) => h == null ? "" : h * 3600 <= (iv || 900) * 2.5 ? "live" : h <= 24 ? "warn" : "down";
  const readDot = (t) => t.read === "instruction" ? (t.hook_registered === false ? "warn" : "live")
    : t.trusted === false ? "down" : t.hook_registered ? ((t.reads_7d || {}).real > 0 ? "live" : "warn") : "down";
  const runAge = (s) => { const m = /Last run: (\S+)/.exec(s || ""); if (!m) return null; const t = Date.parse(m[1]); return isNaN(t) ? null : (Date.now() - t) / 36e5; };
  // The lane declares its own cadence; the schedule string is the fallback for a machine still
  // on a per-tool job, and only a machine that says neither falls back to the tick default.
  const intervalOf = (t) => { if (t && t.cadence_s) return +t.cadence_s;
    const m = /every (\d+)s/.exec(((t && t.plist) || {}).schedule || ""); return m ? +m[1] : 900; };
  const localTool = (id) => (D?.harnesses || []).find(x => x.id === id);
  const shortPath = (p) => String(p || "").replace(/^.*\/(?=[^/]*$)/, "…/");
  const dot = (cls, text) => `<span class="dot ${cls}"></span><span class="sr">${esc(text)}</span>`;
  const hub = () => (D && D.hub) || {};
  const arch = () => (D && D.archive) || {};

  function hz(h) {
    return { id: h.harness || h.id, name: h.name || h.harness || h.id, lane: h.lane,
      reads: (h.reads_7d && h.reads_7d.real != null) ? h.reads_7d.real : (h.reads_7d || 0),
      run: h.run_age_h != null ? h.run_age_h : runAge(h.last_run),
      pulls: h.projects != null ? h.projects + " project" + (h.projects === 1 ? "" : "s") + ", " + h.md_files + " files"
           : (h.md_files != null ? h.md_files + " files" : null) };
  }
  function sparkline(pts) {
    // keep rate by week: 2px line in the de-emphasis hue, the latest week in brass with a surface ring
    if (!pts || pts.length < 2) return "";
    const W = 64, H = 16, n = pts.length, x = (i) => 2 + i * (W - 4) / (n - 1), y = (v) => H - 2 - v / 100 * (H - 4);
    const d = pts.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n - 1).toFixed(1)}" cy="${y(pts[n - 1]).toFixed(1)}" r="3" fill="var(--brass)" stroke="var(--panel)" stroke-width="2"/></svg>`;
  }

  // ---------- top: header, needs, pulse ----------
  // Each destination, the views that belong to it, and what the header says there.
  const PAGE = { review: "review", sources: "sources", hosts: "sources", discover: "sources", archive: "library", recovery: "backups", backups: "backups", jobs: "settings", setup: "settings" };
  const TITLE = { review: "Review", sources: "Sources", hosts: "Sources", discover: "Add a source", archive: "Library", recovery: "Backups", backups: "Backups", jobs: "Jobs", setup: "Hub setup" };
  // Jumps handed out by the status service, the shared assessment and saved preferences
  // still use the names of the views these destinations replaced.
  const RENAMED = { tools: "sources", lanes: "sources" };
  const segment = (pairs) => `<span class="seg" role="group">${pairs.map(([v, label]) => `<button data-view="${v}" aria-pressed="${String(v === view)}">${label}</button>`).join("")}</span>`;
  function renderTop() {
    const page = settingsOpen ? "settings" : PAGE[view];
    $("#vault").textContent = settingsOpen ? "Settings" : TITLE[view] || "Sovereign";
    SovShell.select(page);
    SovShell.archive(selectedRoot?.split("/").pop(), !D || D.error || D._status?.error ? "" : D.machine?.connected ? "live" : "");
    $("#controls").innerHTML = settingsOpen ? ""
      : view === "discover" ? `<button data-view="sources">Done</button>`
      : page === "sources" ? segment([["sources", "Tools"], ["hosts", "Devices"], ["system", "Map"]]) + `<button data-view="discover">Add</button>`
      : page === "backups" ? segment([["recovery", "Archive"], ["backups", "Copies"]])
      : view === "jobs" ? `<button data-view="setup">Hub setup…</button><button data-act="open-settings">Settings</button>`
      : view === "setup" ? `<button data-view="jobs">Jobs</button>` : "";
    $("#vmeta").textContent = SovStatus.seen(D); $("#vmeta").title = SovStatus.caption(D);
    renderVerdict();
  }

  // ---------- rows ----------
  // ---------- the archive, as a picture ----------
  const SERIES = { concept: "s1", entity: "s2", synthesis: "s3" };
  function isoWeekKey(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    const y = t.getUTCFullYear(), w = Math.ceil((((t - Date.UTC(y, 0, 1)) / 864e5) + 1) / 7);
    return y + "-W" + String(w).padStart(2, "0");
  }
  function lastWeeks(n) {
    const out = [], now = new Date();
    for (let i = n - 1; i >= 0; i--) { const x = new Date(now); x.setDate(now.getDate() - 7 * i); out.push({ key: isoWeekKey(x), date: x }); }
    return out;
  }
  const monthOf = (d) => d.toLocaleDateString([], { month: "short" });
  const PRODUCER_X = ["desk", "web", "legacy", "other"];

  // everything the drawer can open, whether or not it is drawn as a row
  function archiveItems() {
    const a = arch(), h = hub(), st = h.status || {}, cov = st.coverage || {};
    const cards = a.cards || [], its = [];
    if (!a.total) return its;
    const arow = (id, label, desc, list, extra) => its.push({ kind: "arch", id, label, desc, list: list || [], extra: extra || {} });
    Object.entries(a.by_type || {}).forEach(([t, n]) => arow("type:" + t, t, num(n) + " cards", cards.filter(c => c.type === t).map(c => c.slug)));
    lastWeeks(14).forEach(w => {
      const cs = cards.filter(c => c.week === w.key), bt = {};
      cs.forEach(c => bt[c.type] = (bt[c.type] || 0) + 1);
      arow("week:" + w.key, w.key.replace("-W", " week "), num(cs.length) + " cards landed", cs.map(c => c.slug),
           { kv: Object.entries(bt).sort((x, y) => y[1] - x[1]).map(([t, n]) => [t, num(n)]) });
    });
    const weeks = ((h.judge || {}).weeks) || [], last = weeks[weeks.length - 1], bd = h.burndown || {};
    arow("judge", "the judge", "keep rate by week, and what sits behind it", [], {
      kv: [["this week", last ? `${num(last.kept)} of ${num(last.judged)} kept · ${pct(last.kept, last.judged)}` : "no judgments yet"],
           ["all time", num((h.judge || {}).total_judged) + " judged"],
           ["last run", st.judged != null ? `${num(st.new_proposals)} of ${num(st.judged)} kept` : "?"],
           ["unjudged", num(st.deferred ?? cov.unjudged_in_window) + " of " + num(cov.processable) + " in scope"],
           ["stranded", num(cov.stranded_pre_watermark) + " behind the watermark"],
           ["burn-down", bd.stopped ? "stopped: " + (bd.note || "under the keep floor") : "running every 2h, stops itself under 2% kept"]],
      gears: h.gears || {}, gears_note: h.gears_note });
    const bs = a.by_src || {};
    Object.keys(bs).forEach(sname => arow("src:" + sname, sname, num(bs[sname]) + " cards", cards.filter(c => c.src === sname).map(c => c.slug)));
    const prod = Object.entries(bs).filter(([x]) => !PRODUCER_X.includes(x)).sort((x, y) => y[1] - x[1]);
    arow("desk", "your desk", "cards distilled from your own workstreams", cards.filter(c => c.src === "desk").map(c => c.slug));
    arow("producers", "producers", prod.length + " lanes have landed cards", cards.filter(c => !PRODUCER_X.includes(c.src)).map(c => c.slug), { producers: prod });
    arow("unattributed", "unattributed", "web sources, one-time imports, unknown", cards.filter(c => ["web", "legacy", "other"].includes(c.src)).map(c => c.slug));
    const wd = a.words || {};
    arow("orphans", "no inbound links", "cards nothing points at", a.orphans || []);
    arow("zerolink", "no outbound links", "cards that link to nothing", a.zero_link || []);
    arow("dangling", "dangling links", "targets that are not cards", [], { dangling: a.dangling || [] });
    arow("long", "over 450 words", "past the one-screen line", a.over_length || [], { kv: [["median", wd.median + " words"], ["p90", wd.p90 + " words"], ["longest", wd.max + " words"]] });
    return its;
  }

  // The Library: what the archive holds. Magnitude only, so one hue; every mark has its
  // number beside it and opens the cards behind it.
  function renderDash() {
    const a = arch(), h = hub(), cards = a.cards || [], total = a.total || 0;
    if (!total) return `<div class="empty">${esc(a.error ? "Archive could not be read: " + a.error : "No cards yet.")}</div>`;
    const open = (id) => `data-open="${esc(id)}"`;
    const rank = (id, label, n, max) => `<button class="lib-rank" ${open(id)} title="${esc(label)}: ${num(n)} cards, ${pct(n, total)}"><span class="l">${esc(label)}</span><span class="trk"><i style="width:${(n / max * 100).toFixed(1)}%"></i></span><span class="v">${num(n)}</span></button>`;
    const order = Object.entries(a.by_type || {}).sort((x, y) => y[1] - x[1]), maxT = Math.max(1, ...order.map(x => x[1]));
    const byType = `<section data-dash="composition"><span class="cap">By type</span>${order.map(([t, n]) => rank("type:" + t, t, n, maxT)).join("")}</section>`;

    // one series, so no legend: the peak and the latest week carry their numbers
    const per = lastWeeks(14).map(w => ({ key: w.key, date: w.date, n: cards.filter(c => c.week === w.key).length }));
    const maxN = Math.max(1, ...per.map(w => w.n)), peak = per.findIndex(w => w.n === maxN);
    const bars = per.map((w, i) => `<button class="lib-bar" ${open("week:" + w.key)} title="${esc(w.key.replace("-W", " week "))}: ${w.n} cards"><i style="height:${(w.n / maxN * 100).toFixed(1)}%">${i === peak || i === per.length - 1 ? `<b>${w.n}</b>` : ""}</i></button>`).join("");
    const axis = per.map((w, i) => `<span>${i === 0 || per[i - 1].date.getMonth() !== w.date.getMonth() ? monthOf(w.date) : ""}</span>`).join("");
    const added = `<section data-dash="weeks"><span class="cap">Added per week</span><div class="lib-weeks">${bars}</div><div class="lib-axis">${axis}</div></section>`;

    // how much of what arrives has been read, and how much of that was kept
    const st = h.status || {}, cov = st.coverage || {}, jw = ((h.judge || {}).weeks) || [], last = jw[jw.length - 1];
    const read = cov.processable ? Math.round(100 * (cov.judged_ever || 0) / cov.processable) : null;
    const fig = (id, label, value, unit, note) => `<button class="fig-tile" ${open(id)}><span class="cap">${label}</span><span class="fig">${esc(value)}${unit ? `<small>${unit}</small>` : ""}</span><span class="fig-note">${esc(note)}</span></button>`;
    const judge = `<section class="tiles4" data-dash="judge">
      ${fig("judge", "Read", read == null ? "–" : String(read), read == null ? "" : "%", cov.processable ? num(cov.judged_ever) + " of " + num(cov.processable) : "not reported")}
      ${fig("judge", "Kept", last && last.judged ? String(Math.round(100 * last.kept / last.judged)) : "–", last && last.judged ? "%" : "", "this week")}
      ${fig("judge", "Waiting", num(st.deferred ?? cov.unjudged_in_window ?? 0), "", "not read yet")}
      ${fig("judge", "Out of reach", num(cov.stranded_pre_watermark ?? 0), "", "before the start")}</section>`;

    const bs = a.by_src || {}, desk = bs.desk || 0, unat = (bs.web || 0) + (bs.legacy || 0) + (bs.other || 0);
    const prodN = Object.entries(bs).filter(([x]) => !PRODUCER_X.includes(x)).reduce((acc, [, n]) => acc + n, 0), maxS = Math.max(desk, prodN, unat, 1);
    const from = `<section data-dash="sources"><span class="cap">From</span>${rank("desk", "your desk", desk, maxS)}${rank("producers", "sources", prodN, maxS)}${rank("unattributed", "unattributed", unat, maxS)}</section>`;
    const ends = [["orphans", "nothing links in", (a.orphans || []).length], ["zerolink", "links to nothing", (a.zero_link || []).length], ["dangling", "broken links", (a.dangling || []).length], ["long", "over 450 words", (a.over_length || []).length]];
    const maxE = Math.max(1, ...ends.map(e => e[2]));
    const loose = `<section data-dash="health"><span class="cap">Loose ends</span>${ends.map(([id, label, n]) => rank(id, label, n, maxE)).join("")}</section>`;

    const vault = (D.obsidian || {}).vault_name;
    const recent = cards.filter(c => Number.isFinite(c.age_d)).sort((x, y) => x.age_d - y.age_d).slice(0, 6);
    const card = (c) => { const inner = `<b>${esc(c.title || c.slug)}</b><span class="tag">${esc(c.type || "")}</span><span class="age">${c.age_d < 1 ? "today" : Math.round(c.age_d) + "d"}</span>`;
      return vault ? `<button class="lib-card" data-act="openurl" data-url="obsidian://open?vault=${encodeURIComponent(vault)}&file=${encodeURIComponent(c.rel || "knowledge/" + c.slug)}" title="Open in Obsidian">${inner}</button>` : `<div class="lib-card">${inner}</div>`; };
    const list = recent.length ? `<section data-dash="recent"><span class="cap">Recent</span><div class="plain-list">${recent.map(card).join("")}</div></section>` : "";
    return `<div class="dash lib"><div class="lib-two">${byType}${added}</div>${judge}<div class="lib-two">${from}${loose}</div>${list}</div>`;
  }
  let discovery=null, discoveryRequest=null, discoveryQuery='', discoveryFilter='all';
  function scanTools(){
    if(discoveryRequest)return;
    const request=String(Date.now())+Math.random();discoveryRequest=request;
    bridge({cmd:'discover',request});
    if(view==='discover')renderList();
    setTimeout(()=>{if(discoveryRequest===request){discoveryRequest=null;discovery={error:'Discovery could not finish. Try Scan again.'};if(view==='discover'){renderList();renderInspector();}}},12000);
  }
  function discoveredTools(){return SovDiscovery.filter(SovDiscovery.candidates(discovery,D),discoveryQuery,discoveryFilter);}
  function discoveryToolbar(){
    return `<div class="discovery-toolbar">
      <div class="acts"><input type="search" id="discovery-search" aria-label="Search discovered tools" placeholder="Search tools" value="${esc(discoveryQuery)}">
      <select id="discovery-filter" aria-label="Filter discovered tools">${[['all','All found'],['available','Available connectors'],['connected','Configured'],['unsupported','No connector yet']].map(([v,l])=>`<option value="${v}" ${discoveryFilter===v?'selected':''}>${l}</option>`).join('')}</select>
      <button data-act="scan-tools" ${discoveryRequest?'disabled':''}>${discoveryRequest?'Scanning…':'Scan again'}</button></div>
      <p class="discovery-caption" role="status">${discovery?.error?esc(discovery.error):discoveryRequest?'Checking known app and command locations…':discovery?`Scanned at ${esc(clock(discovery.scanned_at))}. Configuration can remain after a tool is uninstalled.`:'Ready to scan.'}</p>
      ${discovery?.warnings?.length?`<details><summary>Some locations could not be inspected</summary>${discovery.warnings.map(w=>`<p class="prose">${esc(w)}</p>`).join('')}</details>`:''}</div>`;
  }
  function discoveryInspector(o){
    const h=o.harness,ready=!!h&&SovDiscovery.current(D)&&!!selectedRoot&&selectedRoot===D?.machine?.vault&&D?.machine?.connected!==false;
    const add=ready&&o.connector&&!o.active&&h.detected!==false;
    const setup=!selectedRoot||(D?.machine?.connected===false&&!D?.error&&!D?._status?.error);
    return head(esc(o.name),esc(o.state)+' · '+esc(o.cloud?'Cloud service':'This Mac'))+`
      <div class="sect"><h2>${esc(o.found)}</h2><p class="prose">${o.cloud?'This service connects through the configured Hub.':o.installed?'A known application or command is present.':o.detected?'Only saved configuration was found. The tool may no longer be installed.':'No installation was found in the known locations.'}</p>
      ${o.evidence?.length?`<details><summary>Where it was found · ${o.evidence.length}</summary>${o.evidence.map(e=>`<p class="discovery-evidence"><span>${esc(e.kind)}</span><code>${esc(e.path)}</code></p>`).join('')}</details>`:''}
      ${o.aliases?.length?`<p class="prose">Also recognized as ${esc(o.aliases.join(', '))}. Uses the same producer.</p>`:''}</div>
      ${o.connector?`<div class="sect"><h2>Archive connection</h2><p class="prose">${setup?'Set up producers for your archive to connect this tool.':!ready?'Refresh the configured archive to check this producer before changing it.':o.active?`Collection is configured ${h.runs_on?'on '+esc(h.runs_on):'on this Mac'}.`:h.detected===false?'Open the tool once to finish its setup, then refresh the connection status.':'A connector is available. Review its collection and context setup before adding it.'}</p>
      ${setup?'<button data-goto-view="sources">Sources</button>':!ready?'<button id="discovery-status-refresh">Refresh connection status</button>':''}
      ${add&&h.secret?.env?`<label>${esc(h.secret.label||h.secret.env)}<input type="password" id="secret-${esc(o.connector)}" data-env="${esc(h.secret.env)}" autocomplete="off" spellcheck="false"></label>${h.secret.help?`<p class="prose">${esc(h.secret.help)}</p>`:''}`:''}
      ${add?`<button class="brass" data-act="discover-add" data-harness="${esc(o.connector)}">${h.state==='removed'?'Add again…':'Add producer…'}</button>`:''}</div>
      ${ready?`<button data-act="producer-details" data-harness="${esc(o.connector)}">Producer details</button>`:''}

  // ---------- history: every move is a place you can come back to ----------

  function samePlace(a, b) {

      && ((a.sel && a.sel.id) || null) === ((b.sel && b.sel.id) || null);
  }
  function commit() {
    const p = place();
    if (samePlace(hist.stack[hist.i], p)) return;
    hist.stack = hist.stack.slice(0, hist.i + 1); hist.stack.push(p); hist.i = hist.stack.length - 1;
  }

        if(sel?.id==='p:'+payload.slug){
          const next=h.proposals[Math.min(Math.max(index,0),h.proposals.length-1)];
          sel=next?{view:'review',kind:'prop',id:'p:'+next.slug}:null;
          $('#inspector').scrollTop=0;
        }
        if(view==='review'&&!settingsOpen){
          const rows=$('#rows'),scroll=rows.scrollTop;
          [...rows.querySelectorAll('[data-id]')].find(r=>r.dataset.id==='p:'+payload.slug)?.remove();
          rows.querySelectorAll('[role=option]').forEach(r=>r.setAttribute('aria-selected',String(r.dataset.id===sel?.id)));
          renderReviewIntro(reviewQueue());syncActive();rows.scrollTop=scroll;footerMeta(h.proposals.length);
          if(!sel&&!splitReview())closeInspector();
        }
        renderTop();
      }else{
        // Keep an unconfirmed decision in place; only an explicit recheck can retry it.
        gateChecks.set(payload.slug,{request:null,key:GateModel.reviewKey(D,payload.slug),value:payload});
      }
      showGateNotice(payload.state,['approved','rejected'].includes(payload.state)?null:payload.detail,finished.title);renderInspector();commit();
      // Status caps the loaded queue. Fetch another page only after it is exhausted.
      if(!hub().proposals?.length&&hub().pending>0)refresh();
      return;
    }
    if (kind === "status") {
      const resumeReview=view==='review'&&!reviewQueue().available;
      payload=SovStatus.retain(D,payload);
      // A status probe started before a decision can return its old queue afterwards.
      // Suppress only the exact completed proposal, and retire receipts on a fresh absence.
      for(const [slug,key] of gateCompleted){
        const incoming=GateModel.reviewKey(payload,slug);
        if(incoming===key){
          payload={...payload,hub:{...payload.hub,proposals:payload.hub.proposals.filter(p=>p.slug!==slug),pending:Math.max(0,payload.hub.pending-1)}};
          if(!payload.hub.pending)payload.needs_you=(payload.needs_you||[]).filter(n=>n.kind!=='gate');
        }else if(GateModel.queue(payload,selectedRoot,archiveKnown).available){gateCompleted.delete(slug);}
      }
      if(!GateModel.queue(payload,selectedRoot,archiveKnown).available){gateChecks.clear();gateResolutions.clear();}
      if (GLANCE && payload.error) {D=payload;const g=$('#glance');g.hidden=false;g.innerHTML=`<div class="empty">${esc(payload.error)}</div><button id="g-refresh">Try again</button>`;return;}
      if(!gatePending)for(const [slug,entry] of gateChecks){
        if(entry.key!==GateModel.reviewKey(payload,slug)){gateChecks.delete(slug);gateResolutions.delete(slug);}
      }
      render(payload);
      if(resumeReview&&view==='review'&&reviewQueue().available&&!sel&&!gatePending)gotoGate();
      if (pendingGoto) { const destination = pendingGoto; pendingGoto = null; deliverInner("goto", destination); }
    } else if (kind === "appUpdateResult") {
      appUpdatePending = payload.state === 'started';
      appUpdateResult = payload.error || (payload.state === 'cancelled' ? 'Cancelled. Nothing was changed.'
                        : payload.verification || 'Refresh to see the installed version.');
      // Keep the request pending until completion or failure.
      renderInspector();
      if (settingsOpen) SovSettings.note("set-update-state", appUpdateResult);
      if (payload.state === 'current' || payload.error) setTimeout(refresh, 1500);
    } else if (kind === "backupResult") {
      backupPending=false;
      backupResult=payload.error||(payload.state==='cancelled'?'Cancelled. No backup was started.':payload.verification||'Refresh to inspect the backup result.');
      renderInspector();if(payload.state==='requested')setTimeout(refresh,4000);
    } else if (kind === "vmstart") {
      setTimeout(refresh, 3000);
    } else if (kind === "log") {
      const log = $("#drawer-log"); log.textContent += payload.line + "\n"; log.scrollTop = log.scrollHeight;
      if (payload.state === "end") {
        if(payload.id==='producer'&&pendingProducer){
          pendingProducer.running=false;
          if(!pendingProducer.apply){pendingProducer.reviewed=payload.exit===0;$('#drawer-apply').disabled=payload.exit!==0;}
          else {pendingProducer=null;setTimeout(refresh,800);}
        }
        $("#drawer-state").textContent = payload.exit === 0 ? "done" : "exit " + payload.exit;
        if (payload.id === "connect" && pendingConnect && !pendingConnect.apply && payload.exit === 0) $("#drawer-apply").disabled = false;
        if (payload.id === "hostadd" && pendingHost && !pendingHost.apply && payload.exit === 0) { $("#drawer-apply").disabled = false; $("#drawer-apply").textContent = "Install"; }
        if (pendingHost && pendingHost.apply && payload.state === "end") { pendingHost = null; setTimeout(refresh, 800); }
        if (pendingConnect && pendingConnect.apply) { pendingConnect = null; setTimeout(refresh, 800); }
        if (payload.id === "gate") setTimeout(refresh, 1200);
      }
    } else if (kind === "kickstart") {
      $("#drawer-log").textContent += (payload.exit === 0 ? "started " + payload.label : "exit " + payload.exit + "\n" + payload.out) + "\n";
      $("#drawer-state").textContent = payload.exit === 0 ? "started" : "failed";
      setTimeout(refresh, 4000);
    } else if (kind === "settings") {
      S = Object.assign({}, S, payload);
      const first = !gotSettings; gotSettings = true;
      if (first && !GLANCE && !D && S.defaultView) { const saved = RENAMED[S.defaultView] || S.defaultView; if (PAGE[saved]) view = saved; }
      resetTimer();
      if (settingsOpen) { renderInspector(); const st = $("#s-state"); if (st && saving) st.textContent = payload.error ? "" : "Saved"; }
      saving = false;
    } else if (kind === "goto") {
      if(!window.sovCanQuit())return;
      if (!D && !payload.settings) { pendingGoto = payload; return; }
      if (payload.settings) return openSettings();
      if (payload.snapshot) return window.sovView(payload.snapshot);
      if (payload.view === "review" && !payload.sel) return gotoGate();
      if (payload.view) setView(payload.view, { section: payload.section, silent: !!payload.sel });
      if (payload.sel && PAGE[view]) { const it = findRow(payload.sel.id); if (it) select(it.kind, it.id, true); else commit(); }
    }
  };
  function resetTimer() { clearInterval(timer); timer = setInterval(()=>{if(!gatePending)refresh();}, Math.max(15, S.refresh || 60) * 1000); }

  function renderSetup(d) {
    D = d;
    $("#listcount").textContent = "not connected";
    $("#rows").innerHTML = `<div class="empty">Nothing connected yet.<p><button class="brass" data-goto-view="setup">Hub setup…</button></p></div>`;
    $("#insp").innerHTML = `<div class="insp-title">Connect this machine</div>
      <div class="insp-sub">Point it at an archive once. Every tool found here gets both wires: it reads the archive when a session starts, and its notes flow back to its own lane.</div>
      <div class="sect"><h2>Setup</h2>
        <label for="f-vault">Vault folder<input id="f-vault" name="vault" autocomplete="off" spellcheck="false" placeholder="/Users/you/Documents/My Archive…"></label>
        <label for="f-host">This machine's short name<input id="f-host" name="host" autocomplete="off" spellcheck="false" value="${esc((d.machine || {}).host || "")}"></label>
        <label for="f-core">Always-on cards<input id="f-core" name="core" autocomplete="off" spellcheck="false" placeholder="me,how-to-work-with-me…"></label>
        <label for="f-hub">Hub, if the vault lives on another machine<input id="f-hub" name="hub" autocomplete="off" spellcheck="false" placeholder="hub:/Users/you/Archive…"></label>
        <button class="brass" id="setup-dry">See the dry run</button></div>`;
    openInspector();
    $("#setup-dry").onclick = () => {
      const extra = { vault: $("#f-vault").value.trim(), host: $("#f-host").value.trim(), core: $("#f-core").value.trim(), hub: $("#f-hub").value.trim() };
      if (!extra.vault) return $("#f-vault").focus();
      connect("all", false, extra);
    };
  }

  new ResizeObserver(() => {
    if(view==="review")$("#inspector").setAttribute("aria-hidden",String(!splitReview()&&!$("#inspector").classList.contains("open")));
  }).observe($("#rows"));
  bridge({ cmd: "localState" });
  bridge({ cmd: "settings" });
  setTimeout(refresh, 40);
  resetTimer();
})();
</script>
</body>
