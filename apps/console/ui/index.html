<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sovereign</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>
  /* Instrument panel: graphite and brass. Structure and data are monospaced; prose is
     the only proportional type. At rest the app is a pulse line and a list, nothing
     else. Every record is one line; detail lives in a drawer that opens on click and
     leaves when dismissed, so the resting state stays small. The wire strip is the
     signature: one dual-segment mark per tool, read on the left, write on the right. */
  :root {
    color-scheme: light;
    --ground: #FAFAF7; --panel: #FFFFFF; --sunk: #F2F2EE; --rule: #E4E4DE; --rule-soft: #EFEFEA;
    --ink: #15181C; --ink-2: #3D444E; --muted: #6A7280; --faint: #98A0AC;
    --brass: #A87C12; --brass-ink: #6E5008; --brass-wash: #FBF3DE;
    --live: #2E8B57; --warn: #B5810E; --down: #C23B31; --idle: #B9BEC6;
    --sel: #EDF1F6;
    /* categorical series for the archive's composition, validated against this surface */
    --s1: #A87C12; --s2: #2F6FBF; --s3: #2E8B57; --s4: #98A0AC;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --shadow: 0 1px 2px rgba(20,24,30,.05), 0 8px 24px rgba(20,24,30,.08);
    --drawer: 400px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --ground: #14181D; --panel: #1B2027; --sunk: #1F252D; --rule: #2A313B; --rule-soft: #232A33;
      --ink: #E9ECEF; --ink-2: #B7C0CB; --muted: #8B95A3; --faint: #707A88;
      --brass: #D4A73A; --brass-ink: #EFD9A4; --brass-wash: #262114;
      --live: #3FA96B; --warn: #D19A26; --down: #E0564C; --idle: #4E5763;
      --sel: #222B36;
      --s1: #B58620; --s2: #4F89D2; --s3: #39A064; --s4: #707A88;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
    font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: 500 12px var(--sans); color: var(--ink-2); background: var(--panel);
    border: 1px solid var(--rule); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--faint); color: var(--ink); }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  button.brass { background: var(--brass); border-color: var(--brass); color: #17140A; font-weight: 600; }
  button.danger { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, transparent); }
  button.danger.confirm { background: var(--down); border-color: var(--down); color: #fff; }
  button.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 2px 6px; }
  button[disabled] { opacity: .45; cursor: default; }
  label { display: block; font-size: 12px; color: var(--ink-2); }
  input { font: 12px var(--mono); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px;
    background: var(--sunk); color: var(--ink); width: 100%; margin: 4px 0 10px; }
  input:focus-visible { outline: 2px solid var(--brass); outline-offset: 0; border-color: transparent; }
  .mono { font-family: var(--mono); font-size: 11.5px; letter-spacing: -0.01em; }
  .num, .val, .n, .tile b { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  header { flex: none; display: flex; align-items: center; gap: 10px; height: 52px;
    padding: 24px 16px 0; border-bottom: 1px solid var(--rule); }
  .crown { width: 15px; height: 15px; color: var(--brass); flex: none; }
  header h1 { margin: 0; font: 600 13px var(--sans); letter-spacing: -0.01em; white-space: nowrap; }
  header .meta { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  header .grow { flex: 1; min-width: 0; }
  .hubpill { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-2); background: var(--panel); border: 1px solid var(--rule); border-radius: 999px;
    padding: 3px 10px; white-space: nowrap; }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); flex: none; display: inline-block; }
  .dot.live { background: var(--live); } .dot.warn { background: var(--warn); }
  .dot.down { background: var(--down); }

  #needs { flex: none; border-bottom: 1px solid var(--rule); background: var(--brass-wash); }
  #needs .item { display: flex; gap: 10px; align-items: baseline; padding: 6px 16px;
    cursor: pointer; border-left: 3px solid var(--brass); }
  #needs .item + .item { border-top: 1px solid rgba(168,124,18,.2); }
  #needs .k { font-family: var(--mono); font-size: 10px; color: var(--brass); min-width: 54px; }
  #needs .t { color: var(--brass-ink); font-size: 12px; }

  /* the pulse: the four numbers that move, each a door into the Archive view */
  #pulse { flex: none; display: flex; align-items: stretch; border-bottom: 1px solid var(--rule); background: var(--panel); }
  #pulse .tile { flex: 1; display: flex; align-items: center; gap: 9px; min-width: 0; height: 40px; padding: 0 14px;
    border: 0; border-left: 1px solid var(--rule-soft); border-radius: 0; background: transparent; text-align: left;
    font-family: var(--mono); color: var(--ink-2); }
  #pulse .tile:first-child { border-left: 0; }
  #pulse .tile:hover { background: var(--sunk); color: var(--ink); }
  #pulse .tile .l { font-size: 10.5px; color: var(--faint); white-space: nowrap; }
  #pulse .tile b { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  #pulse .tile .s { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #pulse .tile svg { margin-left: auto; }
  #pulse .tile.bad b { color: var(--down); }
  #pulse svg { flex: none; }

  main { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; position: relative; }
  body.pinned main { grid-template-columns: 1fr var(--drawer); }
  #listpane { display: flex; flex-direction: column; min-width: 0; }
  .bar { flex: none; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 16px;
    border-bottom: 1px solid var(--rule-soft); }
  .seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--rule); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 2px 10px; border-radius: 5px;
    font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .bar .count { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-left: auto; white-space: nowrap; }

  #rows { overflow: auto; flex: 1; }
  #rows:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--brass); }
  .row { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 12px 0 16px;
    border-bottom: 1px solid var(--rule-soft); cursor: pointer; position: relative; }
  .row:hover { background: var(--sunk); }
  .row[aria-selected="true"] { background: var(--sel); }
  .row[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--brass); }
  .row.head { height: 26px; cursor: default; background: var(--ground); position: sticky; top: 0; z-index: 1;
    border-bottom: 1px solid var(--rule); }
  .row.head:hover { background: var(--ground); }
  .row.head .name { color: var(--muted); font-weight: 500; font-size: 11px; width: auto; }
  .row.head .num { color: var(--faint); }
  .row.quiet { cursor: default; color: var(--muted); font-size: 12px; }
  .row.quiet:hover { background: transparent; }
  .row .name { font-family: var(--mono); font-size: 12px; font-weight: 500; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; flex: none; }
  .row .desc { flex: 1; min-width: 0; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .num { font-family: var(--mono); font-size: 11px; color: var(--ink-2); text-align: right; white-space: nowrap; flex: none; }
  .row .chev { color: var(--faint); font-size: 11px; width: 8px; flex: none; }
  .row .tag { font-family: var(--mono); font-size: 10px; color: var(--faint); border: 1px solid var(--rule);
    border-radius: 4px; padding: 0 5px; line-height: 15px; white-space: nowrap; flex: none; }
  .row .tag.on { color: var(--live); border-color: color-mix(in srgb, var(--live) 40%, transparent); }
  .row .tag.mid { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .row .tag.off { color: var(--down); border-color: color-mix(in srgb, var(--down) 40%, transparent); }
  .row .tag.hold { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 45%, transparent); }

  .strip { display: inline-flex; gap: 3px; align-items: center; flex: none; }
  .wm { display: inline-flex; gap: 1px; }
  .wm i { display: block; width: 5px; height: 11px; background: var(--idle); }
  .wm i:first-child { border-radius: 2px 1px 1px 2px; }
  .wm i:last-child { border-radius: 1px 2px 2px 1px; }
  .wm i.live { background: var(--live); } .wm i.warn { background: var(--warn); } .wm i.down { background: var(--down); }
  .wm i.none { background: transparent; border: 1px solid var(--rule); box-sizing: border-box; }
  .strip .none { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

  /* a share of something, as a thin bar: brass by default, a series color when the row is a series */
  .meter { width: 72px; height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; flex: none; }
  .meter i { display: block; height: 100%; background: var(--brass); border-radius: 2px; }
  .meter i.s1 { background: var(--s1); } .meter i.s2 { background: var(--s2); } .meter i.s3 { background: var(--s3); } .meter i.s4 { background: var(--s4); }
  .meter i.live { background: var(--live); } .meter i.warn { background: var(--warn); } .meter i.down { background: var(--down); }
  .contrib { display: inline-flex; align-items: center; gap: 6px; flex: none; width: 82px; justify-content: flex-end; }
  .contrib .meter { width: 40px; }
  .contrib .n { font-family: var(--mono); font-size: 11px; color: var(--ink-2); min-width: 30px; text-align: right; }
  .contrib .n.zero { color: var(--faint); }
  .cards { display: flex; flex-wrap: wrap; gap: 5px; }

  /* the drawer: hidden at rest, over the list on demand, docked when pinned */
  #inspector { position: absolute; top: 0; right: 0; bottom: 0; width: min(var(--drawer), 92vw); overflow: auto;
    background: var(--panel); border-left: 1px solid var(--rule); box-shadow: var(--shadow);
    transform: translateX(102%); transition: transform .16s ease; z-index: 20; }
  #inspector.open { transform: none; }
  body.pinned #inspector { position: static; transform: none; box-shadow: none; width: auto; }
  #inspector .pad { padding: 12px 16px 28px; }
  .insp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .insp-head .sp { flex: 1; }
  .insp-title { font: 600 14px var(--mono); letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .insp-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge { display: inline-block; font-family: var(--mono); font-size: 9.5px; color: var(--brass);
    border: 1px solid color-mix(in srgb, var(--brass) 45%, transparent); border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: 2px; }
  .sect { margin-top: 16px; }
  .sect > h2 { margin: 0 0 6px; font: 500 10.5px var(--mono); color: var(--faint); }
  .kv { display: grid; grid-template-columns: 82px 1fr; gap: 3px 10px; font-size: 12px; margin: 0; }
  .kv dt { font-family: var(--mono); font-size: 10.5px; color: var(--faint); padding-top: 1px; }
  .kv dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
  .tool { border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; }
  .tool .top { display: flex; align-items: center; gap: 8px; }
  .tool .top b { font: 600 12px var(--mono); }
  .tool .top .sp { flex: 1; }
  .wire { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .wire .lab { width: 54px; color: var(--ink-2); flex: none; white-space: nowrap; }
  .wire .track { flex: 1; height: 3px; border-radius: 2px; background: var(--rule); position: relative; }
  .wire .track i { position: absolute; inset: 0; border-radius: 2px; background: var(--idle); }
  .wire .track i.live { background: var(--live); } .wire .track i.warn { background: var(--warn); } .wire .track i.down { background: var(--down); }
  .wire .track i.none { background: transparent; }
  .wire .v { width: 96px; text-align: right; color: var(--ink-2); flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pulls { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-top: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); background: var(--sunk);
    border: 1px solid var(--rule); border-radius: 5px; padding: 2px 7px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { border-color: var(--faint); }
  .chip .dot { margin-right: 5px; }
  .note { font-size: 12px; color: var(--brass-ink); background: var(--brass-wash); border-radius: 7px; padding: 7px 9px; margin-top: 7px; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .empty { color: var(--muted); font-size: 12px; padding: 40px 18px; text-align: center; }
  .prose { font-size: 12px; color: var(--ink-2); }
  .card-body { font-size: 12px; color: var(--ink-2); line-height: 1.5; max-height: 42vh; overflow: auto;
    border: 1px solid var(--rule); border-radius: 8px; padding: 9px 11px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .stack { display: flex; height: 8px; border-radius: 3px; overflow: hidden; gap: 2px; margin: 6px 0 4px; }
  .stack i { display: block; height: 100%; min-width: 2px; }
  .stack i.s1 { background: var(--s1); } .stack i.s2 { background: var(--s2); } .stack i.s3 { background: var(--s3); } .stack i.s4 { background: var(--s4); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend i.s1 { background: var(--s1); } .legend i.s2 { background: var(--s2); } .legend i.s3 { background: var(--s3); } .legend i.s4 { background: var(--s4); }
  table.t { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  table.t th, table.t td { text-align: left; padding: 3px 6px 3px 0; border-bottom: 1px solid var(--rule-soft); }
  table.t th { font: 500 10.5px var(--mono); color: var(--faint); }
  table.t td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .nav { display: inline-flex; gap: 2px; margin-right: 2px; }
  .nav button { padding: 2px 6px; font-size: 11px; }
  .row.head .tri { font-style: normal; display: inline-block; width: 12px; color: var(--faint); }
  .row.head:hover { background: var(--sunk); cursor: pointer; }

  /* Glance: the small box. The same page, loaded with #glance, in a menu-bar popover. */
  #glance { display: none; }
  body.glance header, body.glance #needs, body.glance #pulse, body.glance main, body.glance #drawer { display: none; }
  body.glance #glance { display: flex; flex-direction: column; height: 100%; }
  body.glance.qa #glance { padding-top: 22px; }
  .g-head { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--rule); }
  .g-head b { font: 600 13px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .g-head .sp, .g-foot .sp { flex: 1; }
  .g-rows { flex: 1; overflow: auto; }
  .g-row { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 14px; border: 0;
    border-bottom: 1px solid var(--rule-soft); border-radius: 0; background: transparent; text-align: left;
    font-family: var(--mono); color: var(--ink-2); }
  .g-row:hover { background: var(--sunk); }
  .g-row .l { font-size: 10.5px; color: var(--faint); width: 84px; flex: none; }
  .g-row b { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .g-row .s { font-size: 10.5px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
  .g-row .s.wrap { white-space: normal; line-height: 1.3; font-family: var(--sans); font-size: 11.5px; color: var(--brass-ink); }
  .g-row.hot b { color: var(--brass); }
  .g-row.need { background: var(--brass-wash); height: auto; padding: 8px 14px; }
  .g-foot { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px 0 14px; border-top: 1px solid var(--rule); }
  .g-foot .meta { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  select { font: 12px var(--sans); color: var(--ink); background: var(--sunk); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; }
  label.radio, label.check { display: flex; align-items: center; gap: 7px; padding: 3px 0; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  label.radio input, label.check input { width: auto; margin: 0; }
  @media (max-width: 900px) { #pulse .tile .s { display: none; } }

  /* the archive as a picture */
  .dash { padding: 4px 16px 24px; }
  .panel { padding: 12px 0 10px; border-bottom: 1px solid var(--rule-soft); }
  .panel:last-child { border-bottom: 0; }
  .p-head { display: flex; align-items: baseline; gap: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-bottom: 8px; }
  .p-head b { font: 600 15px var(--mono); color: var(--ink); letter-spacing: -0.02em; }
  .p-row { display: flex; gap: 28px; align-items: stretch; }
  .p-col { min-width: 0; } .p-col.grow { flex: 1; }
  .stack.big { height: 14px; gap: 2px; margin: 0 0 8px; border-radius: 4px; }
  .sg { border: 0; padding: 0; min-width: 3px; border-radius: 0; cursor: pointer; display: block; height: 100%; }
  .sg.s1 { background: var(--s1); } .sg.s2 { background: var(--s2); } .sg.s3 { background: var(--s3); } .sg.s4 { background: var(--s4); }
  .sg:hover { filter: brightness(1.15); }
  .legend .lg { border: 0; background: transparent; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .legend .lg:hover { color: var(--ink); }
  .cols { display: flex; align-items: flex-end; gap: 6px; height: 128px; }
  .col { flex: 1; min-width: 0; display: block; height: 128px; border: 0; background: transparent; padding: 0; cursor: pointer; }
  .col .tot { display: block; font: 10px var(--mono); color: var(--muted); text-align: center; height: 14px; line-height: 14px; }
  .col .stk { display: flex; flex-direction: column-reverse; gap: 2px; height: 100px; }
  .col .stk i { display: block; border-radius: 0; }
  .col .stk i:last-child { border-radius: 3px 3px 0 0; }
  .col .stk i.s1 { background: var(--s1); } .col .stk i.s2 { background: var(--s2); } .col .stk i.s3 { background: var(--s3); } .col .stk i.s4 { background: var(--s4); }
  .col:hover .bar i { filter: brightness(1.15); }
  .col .lbl { display: block; font: 10px var(--mono); color: var(--faint); text-align: center; height: 14px; line-height: 14px; white-space: nowrap; }
  .chart { border: 0; background: transparent; padding: 0; cursor: pointer; display: block; border-radius: 6px; }
  .chart:hover { background: var(--sunk); }
  .keep .lab { font: 10px var(--mono); fill: var(--muted); } .keep .lab.hot { fill: var(--brass); font-weight: 600; }
  .keep .ax { font: 10px var(--mono); fill: var(--faint); }
  .hbar { display: flex; align-items: center; gap: 10px; width: 100%; height: 30px; border: 0; background: transparent; padding: 0;
    font-family: var(--mono); color: var(--ink-2); cursor: pointer; text-align: left; }
  .hbar .l { width: 96px; flex: none; font-size: 11.5px; }
  .hbar .track { flex: 0 0 34%; height: 8px; border-radius: 3px; background: var(--rule); overflow: hidden; }
  .hbar .track i { display: block; height: 100%; background: var(--brass); border-radius: 3px; }
  .hbar .n { width: 42px; text-align: right; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .hbar .p { width: 36px; color: var(--muted); font-size: 10.5px; }
  .hbar .x { flex: 1; min-width: 0; color: var(--muted); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar:hover .l { color: var(--ink); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .dash .tile { display: flex; flex-direction: column; gap: 4px; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 8px;
    background: var(--panel); text-align: left; cursor: pointer; min-width: 0; }
  .dash .tile b { font: 600 16px var(--mono); color: var(--ink); letter-spacing: -0.02em; }
  .dash .tile .l { font-size: 11px; color: var(--muted); }
  .dash .tile .meter { width: 100%; }
  .dash .tile .p { font: 10.5px var(--mono); color: var(--faint); }
  .dash .tile:hover { border-color: var(--faint); }
  @media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, 1fr); } .p-row { flex-direction: column; } }

  .insp input.secret { width: 100%; box-sizing: border-box; font: 12px var(--mono); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sunk); color: var(--ink); }
  .insp input.secret:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
  .insp .secret-help { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.45; }

  #drawer { position: fixed; left: 0; right: 0; bottom: 0; transform: translateY(100%);
    transition: transform .16s ease; background: var(--panel); border-top: 1px solid var(--rule); box-shadow: var(--shadow); z-index: 30; }
  #drawer.open { transform: none; }
  #drawer .bar { padding: 0 16px; }
  #drawer b { font: 600 12px var(--mono); }
  #drawer pre { margin: 0; padding: 10px 16px 14px; max-height: 220px; overflow: auto;
    font-family: var(--mono); font-size: 11px; line-height: 1.5; white-space: pre-wrap; color: var(--ink-2); }
  #drawer .state { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  @media (prefers-reduced-motion: reduce) { #drawer, #inspector { transition: none; } }
  body.qa #drawer, body.qa #inspector { transition: none; }   /* snapshot QA: an occluded web view gets no animation frames */
</style>
</head>
<body>
<header>
  <svg class="crown" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 18h18v2H3v-2zm0-2 1.5-9 4.5 4 3-6 3 6 4.5-4L21 16H3z"/></svg>
  <h1 id="vault">Sovereign</h1>
  <div class="meta grow" id="meta">reading status…</div>
  <span class="hubpill" id="hubpill"><span class="dot"></span>hub</span>
  <button id="refresh" title="Refresh (⌘R)">Refresh</button>
  <button id="gear" class="quiet" title="Settings (⌘,)" aria-label="Settings">⚙</button>
</header>

<div id="needs" hidden></div>
<div id="pulse" hidden></div>
<div id="glance" hidden></div>

<main>
  <div id="listpane">
    <div class="bar">
      <span class="nav"><button id="back" class="quiet" aria-label="Back" title="Back (⌘[)" disabled>◀</button><button id="fwd" class="quiet" aria-label="Forward" title="Forward (⌘])" disabled>▶</button></span>
      <div class="seg" role="group" aria-label="View">
        <button data-view="hosts" aria-pressed="true">Hosts</button>
        <button data-view="archive" aria-pressed="false">Archive</button>
        <button data-view="lanes" aria-pressed="false">Lanes</button>
        <button data-view="tools" aria-pressed="false">Tools</button>
        <button data-view="jobs" aria-pressed="false">Jobs</button>
      </div>
      <span class="count" id="listcount"></span>
    </div>
    <div id="rows" role="listbox" tabindex="0" aria-label="Records"></div>
  </div>
  <aside id="inspector" aria-label="Detail"><div class="pad" id="insp"></div></aside>
</main>

<div id="drawer">
  <div class="bar"><b id="drawer-title">Output</b><span class="state" id="drawer-state"></span>
    <span style="flex:1"></span>
    <button class="brass" id="drawer-apply" hidden>Install</button>
    <button id="drawer-close">Close</button></div>
  <pre id="drawer-log"></pre>
</div>

<script>
// A script error must never be a blank page: paint it where the eye lands.
window.onerror = function (msg, src, line, col) {
  var g = document.getElementById("glance") || document.getElementById("insp");
  if (g) { g.hidden = false; g.innerHTML += '<div class="empty" style="color:var(--down)">Script error: ' + String(msg) + ' at ' + line + ':' + col + '</div>'; }
  var c = document.getElementById("listcount"); if (c) c.textContent = "script error " + line + ":" + col + " " + String(msg).slice(0, 80);
};
(function () {
  const $ = (s, r) => (r || document).querySelector(s);
  const bridge = (m) => { try { window.webkit.messageHandlers.sov.postMessage(m); } catch (e) { console.warn("no bridge", e); } };
  let D = null, view = "hosts", sel = null, pendingConnect = null, pinned = false, armed = null;
  const GLANCE = location.hash.startsWith("#glance");
  document.body.classList.toggle("glance", GLANCE);
  if (location.hash === "#glance-qa") document.body.classList.add("qa");
  let S = { where: "dock", loginItem: false, refresh: 60, defaultView: "archive", loginState: "unavailable" };
  let gotSettings = false, timer = null, settingsOpen = false, domIdentity = null;
  const hist = { stack: [], i: -1 };
  try { pinned = localStorage.getItem("sov.pinned") === "1"; } catch (e) {}
  document.body.classList.toggle("pinned", pinned);

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const age = (h) => h == null ? "–" : h < 1 ? Math.max(1, Math.round(h * 60)) + "m" : h < 48 ? (Math.round(h * 10) / 10) + "h" : Math.round(h / 24) + "d";
  const clock = (iso) => { if (!iso) return "?"; const d = new Date(iso); return isNaN(d) ? String(iso).slice(11, 16) : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
  const num = (n) => n == null ? "?" : Number(n).toLocaleString();
  const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
  const freshDot = (h) => h == null ? "" : h <= 24 ? "live" : h <= 168 ? "warn" : "";
  const runDot = (h, iv) => h == null ? "" : h * 3600 <= (iv || 900) * 2.5 ? "live" : h <= 24 ? "warn" : "down";
  const readDot = (t) => t.read === "instruction" ? (t.hook_registered === false ? "warn" : "live")
    : t.trusted === false ? "down" : t.hook_registered ? ((t.reads_7d || {}).real > 0 ? "live" : "warn") : "down";
  const runAge = (s) => { const m = /Last run: (\S+)/.exec(s || ""); if (!m) return null; const t = Date.parse(m[1]); return isNaN(t) ? null : (Date.now() - t) / 36e5; };
  const intervalOf = (t) => { const m = /every (\d+)s/.exec(((t && t.plist) || {}).schedule || ""); return m ? +m[1] : 900; };
  const localTool = (id) => (D.harnesses || []).find(x => x.id === id);
  const shortPath = (p) => String(p || "").replace(/^.*\/(?=[^/]*$)/, "…/");
  const dot = (cls, text) => `<span class="dot ${cls}"></span><span class="sr">${esc(text)}</span>`;
  const hub = () => (D && D.hub) || {};
  const arch = () => (D && D.archive) || {};

  function hz(h) {
    return { id: h.harness || h.id, name: h.name || h.harness || h.id, lane: h.lane,
      reads: (h.reads_7d && h.reads_7d.real != null) ? h.reads_7d.real : (h.reads_7d || 0),
      run: h.run_age_h != null ? h.run_age_h : runAge(h.last_run),
      pulls: h.projects != null ? h.projects + " project" + (h.projects === 1 ? "" : "s") + ", " + h.md_files + " files"
           : (h.md_files != null ? h.md_files + " files" : null) };
  }
  function wireMark(t, local) {
    const r = local && local.read === "none" ? "none" : local ? readDot(local) : (t.reads > 0 ? "live" : "warn");
    const w = runDot(t.run, intervalOf(local));
    const rt = r === "none" ? "no read wire (pull only)" : `${t.reads} read${t.reads === 1 ? "" : "s"} this week`;
    return `<span class="wm" title="${esc(t.id)} · ${rt} · mirror ${age(t.run)} ago"><i class="${r}"></i><i class="${w}"></i></span>`;
  }
  function meter(share, cls) {
    const w = Math.round(Math.min(1, Math.max(0, share || 0)) * 100);
    return `<span class="meter"><i class="${cls || ""}" style="width:${share ? Math.max(4, w) : 0}%"></i></span>`;
  }
  function sparkline(pts) {
    // keep rate by week: 2px line in the de-emphasis hue, the latest week in brass with a surface ring
    if (!pts || pts.length < 2) return "";
    const W = 64, H = 16, n = pts.length, x = (i) => 2 + i * (W - 4) / (n - 1), y = (v) => H - 2 - v / 100 * (H - 4);
    const d = pts.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n - 1).toFixed(1)}" cy="${y(pts[n - 1]).toFixed(1)}" r="3" fill="var(--brass)" stroke="var(--panel)" stroke-width="2"/></svg>`;
  }

  // ---------- top: header, needs, pulse ----------
  function renderTop() {
    const m = D.machine || {}, h = hub(), obs = D.obsidian || {};
    $("#vault").textContent = m.vault_name || "Sovereign";
    $("#meta").textContent = `${m.host} · ${m.template_rev || "?"}${obs.sync ? " · obsidian " + obs.sync : ""} · ${clock(D.generated_at)}`;
    const hp = $("#hubpill"), j = h.jobs || {}, nightly = j["archivist-nightly"];
    if (h.reachable) hp.innerHTML = `${dot("live", "hub online")}hub ${esc(((h.via || "").startsWith("ssh ") ? h.via.slice(4) : (h.hub_host || "here")).toLowerCase())}${nightly ? " · nightly " + clock(nightly.ts) : ""}`;
    else if (h.reachable === false) hp.innerHTML = `${dot("down", "hub offline")}hub silent`;
    else hp.innerHTML = `${dot("", "hub unchecked")}hub unchecked`;

    const needs = D.needs_you || [], nd = $("#needs");
    nd.hidden = !needs.length;
    nd.innerHTML = needs.map((n, i) => `<div class="item" data-need="${i}" role="button" tabindex="0"><span class="k">${esc(n.kind)}</span><span class="t">${esc(n.text)}</span></div>`).join("");

    const pb = $("#pulse");
    if (!h.reachable) {
      pb.hidden = h.reachable == null;
      if (!pb.hidden) pb.innerHTML = `<div class="tile bad" style="flex:1"><b>hub did not answer</b><span class="s">${esc(h.error || "")} · governance state is unknown until it does</span></div>`;
      return;
    }
    pb.hidden = false;
    const st = h.status || {}, cov = st.coverage || {}, a = arch(), weeks = ((h.judge || {}).weeks) || [];
    const rates = weeks.map(w => w.judged ? 100 * w.kept / w.judged : 0);
    const last = weeks[weeks.length - 1];
    const awaiting = st.deferred ?? cov.unjudged_in_window;
    const pending = h.pending ?? 0;
    pb.innerHTML = `
      <button class="tile ${pending ? "" : ""}" data-goto-section="gate" title="Open the gate">
        <span class="l">at the gate</span><b>${num(pending)}</b><span class="s">${pending ? "waiting for you" : "nothing waiting"}</span></button>
      <button class="tile" data-goto-section="judge" title="Open the judge">
        <span class="l">judge kept</span><b>${st.judged != null ? `${num(st.new_proposals)} of ${num(st.judged)}` : "?"}</b>
        <span class="s">${last ? "wk " + pct(last.kept, last.judged) : ""}</span>${sparkline(rates)}</button>
      <button class="tile" data-goto-section="judge" title="Open the backlog">
        <span class="l">unjudged</span><b>${num(awaiting)}</b><span class="s">of ${num(cov.processable)}${cov.stranded_pre_watermark ? " · " + num(cov.stranded_pre_watermark) + " stranded" : ""}${(h.burndown || {}).stopped ? " · burn-down stopped" : ""}</span></button>
      <button class="tile" data-goto-section="composition" title="Open the archive">
        <span class="l">cards</span><b>${num(a.total)}</b><span class="s">${a.by_type ? Object.entries(a.by_type).sort((x, y) => y[1] - x[1]).map(([k, v]) => v + " " + ({ concept: "con", entity: "ent", synthesis: "syn", plan: "plan", review: "rev" }[k] || k)).join(" · ") : ""}</span></button>`;
  }

  // ---------- rows ----------
  // ---------- the archive, as a picture ----------
  const SERIES = { concept: "s1", entity: "s2", synthesis: "s3" };
  function isoWeekKey(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    const y = t.getUTCFullYear(), w = Math.ceil((((t - Date.UTC(y, 0, 1)) / 864e5) + 1) / 7);
    return y + "-W" + String(w).padStart(2, "0");
  }
  function lastWeeks(n) {
    const out = [], now = new Date();
    for (let i = n - 1; i >= 0; i--) { const x = new Date(now); x.setDate(now.getDate() - 7 * i); out.push({ key: isoWeekKey(x), date: x }); }
    return out;
  }
  const monthOf = (d) => d.toLocaleDateString([], { month: "short" });
  const PRODUCER_X = ["desk", "web", "legacy", "other"];

  // everything the drawer can open, whether or not it is drawn as a row
  function archiveItems() {
    const a = arch(), h = hub(), st = h.status || {}, cov = st.coverage || {};
    const cards = a.cards || [], props = h.proposals || [];
    const its = [{ kind: "head", id: "h-gate", section: "gate", label: "At the gate", n: props.length ? num(h.pending) + " waiting" : "nothing waiting" }];
    props.forEach(p => its.push({ kind: "prop", id: "p:" + p.slug, o: p }));
    if (!a.total) return its;
    const arow = (id, label, desc, list, extra) => its.push({ kind: "arch", id, label, desc, list: list || [], extra: extra || {} });
    Object.entries(a.by_type || {}).forEach(([t, n]) => arow("type:" + t, t, num(n) + " cards", cards.filter(c => c.type === t).map(c => c.slug)));
    lastWeeks(14).forEach(w => {
      const cs = cards.filter(c => c.week === w.key), bt = {};
      cs.forEach(c => bt[c.type] = (bt[c.type] || 0) + 1);
      arow("week:" + w.key, w.key.replace("-W", " week "), num(cs.length) + " cards landed", cs.map(c => c.slug),
           { kv: Object.entries(bt).sort((x, y) => y[1] - x[1]).map(([t, n]) => [t, num(n)]) });
    });
    const weeks = ((h.judge || {}).weeks) || [], last = weeks[weeks.length - 1], bd = h.burndown || {};
    arow("judge", "the judge", "keep rate by week, and what sits behind it", [], {
      kv: [["this week", last ? `${num(last.kept)} of ${num(last.judged)} kept · ${pct(last.kept, last.judged)}` : "no judgments yet"],
           ["all time", num((h.judge || {}).total_judged) + " judged"],
           ["last run", st.judged != null ? `${num(st.new_proposals)} of ${num(st.judged)} kept` : "?"],
           ["unjudged", num(st.deferred ?? cov.unjudged_in_window) + " of " + num(cov.processable) + " in scope"],
           ["stranded", num(cov.stranded_pre_watermark) + " behind the watermark"],
           ["burn-down", bd.stopped ? "stopped: " + (bd.note || "under the keep floor") : "running every 2h, stops itself under 2% kept"]],
      gears: h.gears || {}, gears_note: h.gears_note });
    const bs = a.by_src || {};
    Object.keys(bs).forEach(sname => arow("src:" + sname, sname, num(bs[sname]) + " cards", cards.filter(c => c.src === sname).map(c => c.slug)));
    const prod = Object.entries(bs).filter(([x]) => !PRODUCER_X.includes(x)).sort((x, y) => y[1] - x[1]);
    arow("desk", "your desk", "cards distilled from your own workstreams", cards.filter(c => c.src === "desk").map(c => c.slug));
    arow("producers", "producers", prod.length + " lanes have landed cards", cards.filter(c => !PRODUCER_X.includes(c.src)).map(c => c.slug), { producers: prod });
    arow("unattributed", "unattributed", "web sources, one-time imports, unknown", cards.filter(c => ["web", "legacy", "other"].includes(c.src)).map(c => c.slug));
    const wd = a.words || {};
    arow("orphans", "no inbound links", "cards nothing points at", a.orphans || []);
    arow("zerolink", "no outbound links", "cards that link to nothing", a.zero_link || []);
    arow("dangling", "dangling links", "targets that are not cards", [], { dangling: a.dangling || [] });
    arow("long", "over 450 words", "past the one-screen line", a.over_length || [], { kv: [["median", wd.median + " words"], ["p90", wd.p90 + " words"], ["longest", wd.max + " words"]] });
    return its;
  }

  function renderDash() {
    const a = arch(), h = hub(), cards = a.cards || [], total = a.total || 0;
    if (!total) return `<div class="empty">${esc(a.error ? "Archive could not be read: " + a.error : "No cards yet.")}</div>`;
    const W = Math.max(320, ($("#rows").clientWidth || 800) - 32);
    const open = (id) => `data-open="${esc(id)}"`;

    // composition: one bar, the whole archive, labels on the marks
    const order = Object.entries(a.by_type || {}).sort((x, y) => y[1] - x[1]);
    const comp = `<section class="panel" data-dash="composition">
      <div class="p-head"><b>${num(total)} cards</b><span>the trusted layer, by type</span></div>
      <div class="stack big" role="img" aria-label="${esc(order.map(([t, n]) => n + " " + t).join(", "))}">${order.map(([t, n]) => `<button class="sg ${SERIES[t] || "s4"}" style="flex:${n}" ${open("type:" + t)} title="${esc(t)}: ${num(n)} cards, ${pct(n, total)}"></button>`).join("")}</div>
      <div class="legend">${order.map(([t, n]) => `<button class="lg" ${open("type:" + t)}><i class="${SERIES[t] || "s4"}"></i>${esc(t)} ${num(n)} · ${pct(n, total)}</button>`).join("")}</div></section>`;

    // the pulse: cards landed per week, and the judge's keep rate over the same weeks
    const weeks = lastWeeks(14);
    const perWeek = weeks.map(w => { const cs = cards.filter(c => c.week === w.key), bt = {}; cs.forEach(c => bt[c.type] = (bt[c.type] || 0) + 1); return { key: w.key, date: w.date, n: cs.length, bt }; });
    const maxN = Math.max(1, ...perWeek.map(w => w.n));
    const peaks = perWeek.map((w, i) => [w.n, i]).sort((x, y) => y[0] - x[0]).slice(0, 3).filter(x => x[0] > 0).map(x => x[1]);
    const cols = perWeek.map((w, i) => {
      const segs = order.map(([t]) => w.bt[t] ? `<i class="${SERIES[t] || "s4"}" style="height:${(w.bt[t] / maxN * 100).toFixed(1)}%"></i>` : "").join("");
      const lbl = (i === 0 || perWeek[i - 1].date.getMonth() !== w.date.getMonth()) ? monthOf(w.date) : "";
      return `<button class="col" ${open("week:" + w.key)} title="${esc(w.key.replace("-W", " week "))}: ${w.n} cards landed"><span class="tot">${peaks.includes(i) ? w.n : ""}</span><span class="stk">${segs}</span><span class="lbl">${lbl}</span></button>`;
    }).join("");
    const jw = ((h.judge || {}).weeks) || [], byKey = {}; jw.forEach(x => byKey[x.week] = x);
    const have = weeks.map((w, i) => { const x = byKey[w.key]; return x && x.judged ? { i, v: 100 * x.kept / x.judged, x } : null; }).filter(Boolean);
    let line = `<div class="empty" style="padding:24px 0">no judgments yet</div>`;
    if (have.length >= 2) {
      const cw = Math.max(180, Math.round(W * 0.36)), ch = 128, pad = 16, top = 22, bottom = 18;
      const X = (i) => pad + i * (cw - 2 * pad) / (weeks.length - 1), Y = (v) => top + (100 - v) / 100 * (ch - top - bottom);
      const step = (cw - 2 * pad) / (weeks.length - 1);
      const d = have.map((p, k) => (k ? "L" : "M") + X(p.i).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
      const first = have[0], lastp = have[have.length - 1];
      line = `<svg class="keep" width="${cw}" height="${ch}" viewBox="0 0 ${cw} ${ch}" role="img" aria-label="keep rate by week, ${Math.round(first.v)}% to ${Math.round(lastp.v)}%">
        <path d="${d}" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${have.map(p => `<rect x="${(X(p.i) - step / 2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${ch}" fill="transparent"><title>${esc(p.x.week.replace("-W", " week "))}: ${num(p.x.kept)} of ${num(p.x.judged)} kept, ${Math.round(p.v)}%</title></rect>`).join("")}
        <circle cx="${X(lastp.i).toFixed(1)}" cy="${Y(lastp.v).toFixed(1)}" r="3.5" fill="var(--brass)" stroke="var(--panel)" stroke-width="2"/>
        <text x="${X(first.i).toFixed(1)}" y="${(Y(first.v) - 8).toFixed(1)}" class="lab" text-anchor="middle">${Math.round(first.v)}%</text>
        <text x="${X(lastp.i).toFixed(1)}" y="${(Y(lastp.v) - 9).toFixed(1)}" class="lab hot" text-anchor="middle">${Math.round(lastp.v)}%</text>
        ${weeks.map((w, i) => (i === 0 || weeks[i - 1].date.getMonth() !== w.date.getMonth()) ? `<text x="${X(i).toFixed(1)}" y="${ch - 4}" class="ax" text-anchor="middle">${monthOf(w.date)}</text>` : "").join("")}
      </svg>`;
    }
    const pulse = `<section class="panel" data-dash="judge"><div class="p-row">
      <div class="p-col grow"><div class="p-head"><span>cards landed, by week</span></div><div class="cols">${cols}</div></div>
      <div class="p-col"><div class="p-head"><span>the judge, keep rate</span></div><button class="chart" ${open("judge")} title="the judge">${line}</button></div>
    </div></section>`;

    // sources: ranked bars, honest at any width
    const bs = a.by_src || {};
    const desk = bs.desk || 0, unat = (bs.web || 0) + (bs.legacy || 0) + (bs.other || 0);
    const prod = Object.entries(bs).filter(([x]) => !PRODUCER_X.includes(x)).sort((x, y) => y[1] - x[1]);
    const prodN = prod.reduce((acc, [, n]) => acc + n, 0), maxS = Math.max(desk, prodN, unat, 1);
    const hbar = (id, label, n, extra) => `<button class="hbar" ${open(id)} title="${esc(label)}: ${num(n)} cards, ${pct(n, total)}"><span class="l">${esc(label)}</span><span class="track"><i style="width:${(n / maxS * 100).toFixed(1)}%"></i></span><span class="n">${num(n)}</span><span class="p">${pct(n, total)}</span><span class="x">${extra || ""}</span></button>`;

    return `<div class="dash">${comp}${pulse}${src}${health}</div>`;
  }
  function items() {

      return `${dot(net.online == null ? "" : net.online ? "live" : "down", net.online == null ? "network unknown" : net.online ? "online" : "offline")}
        <span class="name" style="width:138px">${esc(o.host)}</span>
        <span class="desc">${esc([m.kind, m.where].filter(Boolean).join(" · "))}</span>

        <span class="strip">${strip}</span>
        ${contribCell((o.lanes || []).reduce((a, l) => a + (l.cards || 0), 0))}
        <span class="num" style="width:40px">${age(newest)}</span>
        <span class="chev">›</span>`;
    }

      const r = (o.read || "none").replace(/\s*\(.*\)$/, "");
      return `${dot(freshDot(o.vault_age_h), o.vault_age_h == null ? "age unknown" : o.vault_age_h <= 24 ? "fresh" : o.vault_age_h <= 168 ? "this week" : "stale")}
        <span class="name" style="width:160px">${esc(o.lane)}</span>

      const cls = state === "connected" ? "on" : state === "partial" ? "mid" : state === "not connected" ? "off" : "";
      const t = h ? hz(h) : null;
      return `${dot(state === "connected" ? "live" : o.detected ? "warn" : "", state)}
        <span class="name" style="width:174px">${esc(o.name)}</span>
        <span class="desc">${esc(h ? "lane " + h.lane : (o.note || ""))}</span>

  function renderList() {

  // ---------- the drawer ----------
  function kv(pairs) {

  function toolBlock(t, local, title) {
    const pullOnly = !!(local && local.read === "none");

    const wd = runDot(t.run, intervalOf(local));

    return `<div class="tool">
      <div class="top"><b>${esc(title || t.name || t.id)}</b><span class="sp"></span>
        ${local && local.state ? `<span class="tag ${local.state === "connected" ? "on" : "mid"}" style="font-family:var(--mono);font-size:10px;border:1px solid var(--rule);border-radius:4px;padding:0 5px">${esc(local.state)}</span>` : ""}</div>

  function cardLink(rel, name) {

  function cardChips(slugs, limit) {

  }
  function contribSect(lanes) {

      if (x.dangling) body += `<div class="sect"><h2>Targets that are not cards</h2><table class="t"><tr><th>link</th><th>from</th></tr>${x.dangling.map(d => `<tr><td class="mono">${esc(d.target)}</td><td>${d.from.map(f => cardLink("knowledge/" + f, f)).join(" ")}</td></tr>`).join("")}</table></div>`;
      if (it.list.length) body += `<div class="sect"><h2>${num(it.list.length)} cards</h2>${cardChips(it.list)}</div>`;
      if (!body) body = `<div class="empty">Nothing more to show for this row.</div>`;

        `${p.reason ? `<div class="prose">${esc(p.reason)}</div>` : ""}

        <div class="sect">${kv([["slug", `<span class="mono">${esc(p.slug)}</span>`, "raw"], ["from", p.source ? `<span class="mono">${esc(p.source)}</span>` : null, "raw"], ["length", p.words + " words"], ["waiting", age(p.age_h)]])}</div>
        <div class="sect"><h2>The card as drafted</h2><div class="card-body">${esc(p.body || "(empty)")}</div></div>

        <div class="sect"><h2>Network</h2>${kv([
          ["state", `${dot(net.online == null ? "" : net.online ? "live" : "down", "")} ${net.online == null ? "unknown" : net.online ? "online" : "offline"}`, "raw"],

        <div class="sect"><h2>Contract</h2>${kv([["host", o.host], ["read", o.read], ["write", o.write], ["status", o.status]])}</div>
        <div class="sect"><h2>Freshness · newest file</h2>${kv([

    clearTimeout(rsz); rsz = setTimeout(() => { const d = document.querySelector(".dash"); if (d) d.outerHTML = renderDash(); }, 120);
  }).observe($("#rows"));
  bridge({ cmd: "settings" });
  setTimeout(refresh, 40);
  resetTimer();
})();
</script>
